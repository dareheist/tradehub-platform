<title>TradeHub — Trading Terminal</title>
<style>
:root{

*{box-sizing:border-box}

.auth{max-width:650px;margin:auto;padding:42px 26px 70px;background:

.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.check{display:flex;align-items:center;gap:10px;color:#9faabd;font-size:17px}.check input{width:20px;height:20px;accent-color:var(--green)}

.target-digits{display:grid;grid-template-columns:repeat(10,1fr);background:#0b121b;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.target-label{grid-column:1/-1;padding:4px 10px;color:#66758b;font-size:9px;font-weight:900;text-transform:uppercase}.target-digit{height:40px;background:#0b121b;color:#697589;border-right:1px solid #182333;font-weight:900}.target-digit.selected{background:rgba(0,200,150,.16);color:var(--green);box-shadow:inset 0 -2px 0 var(--green)}.chart-time-label{position:absolute;left:8px;bottom:20px;z-index:10;color:#cbd4df;font-size:9px;background:rgba(7,13,20,.78);padding:3px 6px;border-radius:5px;pointer-events:none}

.chart{height:410px;background:#101824;border:1px solid #1f2a3b;border-radius:20px;position:relative;overflow:hidden}
.chart-scroll{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x}.chart-scroll::-webkit-scrollbar{display:none}.chart-canvas{height:100%;min-width:980px}.chart svg{width:1100px;min-width:1100px;height:100%}.chart-card{position:absolute;left:12px;top:12px;background:#131c2a;border:1px solid #293548;border-radius:16px;padding:9px 16px;z-index:2}.chart-card b{display:block;font-size:17px}.chart-card span{color:#9aa5b5;font-size:14px}.price{position:absolute;right:0;top:40%;background:#182331;border:2px solid #2caea4;border-radius:8px;padding:8px;font-weight:900}.zoom{position:absolute;left:12px;bottom:12px;z-index:2;display:grid}.zoom button{width:58px;height:58px;background:#182334;color:#9eabbf;border:1px solid #2a374a;font-size:28px}.zoom button:first-child{border-radius:14px 14px 0 0}.zoom button:last-child{border-radius:0 0 14px 14px}

.modebar{display:grid;grid-template-columns:1fr 1fr;background:#0c151d;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.mode{padding:16px;text-align:center;color:#687487;font-weight:900}.mode.active{color:#00e5a8;background:rgba(0,200,150,.14);box-shadow:none;text-shadow:0 0 12px rgba(0,200,150,.35)}
.controls{background:#0b121b;flex:0 0 auto}.stake-row{display:grid;grid-template-columns:60px 1fr 60px 1.2fr;min-height:86px;border-bottom:1px solid var(--line)}.minus,.plus{background:#0d1621;color:#8290a4;font-size:28px;border-right:1px solid var(--line)}.plus{border-left:1px solid var(--line);border-right:0}.stake{display:flex;flex-direction:column;align-items:center;justify-content:center}.stake small{color:#8e99aa;font-weight:800}.stake-input{width:100%;height:42px;border:0;background:transparent;color:#fff;text-align:center;font-size:28px;font-weight:900;outline:none;padding:0}.stake-input:focus{background:rgba(255,255,255,.04);border-radius:8px}.scanner-btn{background:#1c1739;color:#9d8cff;font-weight:900;font-size:15px}.target-row{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);color:#8e99aa;font-size:12px;font-weight:800}.target-row select{background:#111a27;color:#fff;border:1px solid #2b3747;border-radius:8px;padding:7px 10px;font-weight:900}
.risk-row{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line)}.risk{padding:16px;text-align:center;border-right:1px solid var(--line)}.risk:last-child{border:0}.risk small{display:block;font-weight:900;margin-bottom:6px}.risk.profit small{color:var(--green)}.risk.loss small{color:#ff5a83}.risk.mult small{color:#ffc400}.risk strong{font-size:24px}.risk-input{width:100%;max-width:120px;margin:auto;background:transparent;border:1px solid transparent;border-radius:10px;color:inherit;text-align:center;font-size:24px;font-weight:900;padding:5px 3px;outline:none}.risk-input:focus{border-color:var(--green);background:rgba(255,255,255,.04)}.risk-input::-webkit-outer-spin-button,.risk-input::-webkit-inner-spin-button{margin:0}.mode{cursor:pointer;transition:.2s}.mode.active{color:var(--green);background:rgba(0,200,150,.08);box-shadow:inset 0 -2px 0 var(--green)}
.status{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;color:#748096}.status strong{font-size:18px}.status .positive{color:var(--green)}.status .negative{color:var(--red)}
.trade-actions{display:grid;grid-template-columns:1fr 1fr;height:92px}.trade-btn{font-size:25px;font-weight:1000;color:#fff}.even{background:#00c896}.odd{background:#ff2059}.trade-btn.running{background:var(--orange)!important;color:#fff}.trade-btn.recommended{box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 0 18px rgba(0,200,150,.22)}.trade-btn:disabled{opacity:.55}

.drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex}.drawer-panel{width:min(88%,390px);height:100%;background:#090f17;border-right:1px solid #222d3c;overflow:auto}.drawer-head{padding:26px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.drawer-item{padding:19px 28px;display:flex;align-items:center;gap:18px;color:#c1c9d5;font-size:18px}.drawer-item:hover{background:#111a27}
.drawer-item{cursor:pointer}
.help-list{display:grid;gap:10px;margin-top:16px}.help-q{width:100%;text-align:left;background:#151f2f;color:#e8edf5;border:1px solid #273449;border-radius:12px;padding:13px;font-weight:800}.help-a{display:none;padding:0 13px 13px;color:#9ba7b8;line-height:1.55}.help-a.open{display:block}
.chat-box{height:310px;overflow:auto;background:#0a111b;border:1px solid #263347;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px}.chat-msg{max-width:82%;padding:10px 12px;border-radius:13px;line-height:1.4}.chat-msg.bot{align-self:flex-start;background:#172235;color:#dfe7f2}.chat-msg.user{align-self:flex-end;background:#00c896;color:#04110d}.chat-form{display:grid;grid-template-columns:1fr 82px;gap:8px;margin-top:10px}.chat-form input{height:50px;background:#101a27;border:1px solid #273449;border-radius:12px;color:#fff;padding:0 12px}.chat-form button{border-radius:12px;background:var(--green);font-weight:900}
.setting-grid{display:grid;gap:14px;margin-top:16px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:#151f2f;border:1px solid #273449;border-radius:13px}.setting-row input{width:100%;max-width:260px;height:46px;background:#0e1723;border:1px solid #2a374a;border-radius:10px;color:#fff;padding:0 12px}.setting-row small{display:block;color:#8f9caf;margin-top:3px}.setting-note{color:#8f9caf;line-height:1.5}.toggle{width:52px;height:30px;border-radius:20px;background:#293548;position:relative;padding:0}.toggle i{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#a8b2c0;transition:.2s}.toggle.on{background:rgba(0,200,150,.35)}.toggle.on i{left:26px;background:var(--green)}
.responsible-card{background:#151f2f;border:1px solid #273449;border-radius:14px;padding:15px;margin-top:14px}.responsible-card h4{margin:0 0 7px}.limit-row{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;margin-top:12px}.limit-row input{height:45px;background:#0e1723;border:1px solid #2a374a;border-radius:10px;color:#fff;padding:0 10px}
.ref-code{font-size:25px;font-weight:1000;letter-spacing:3px;text-align:center;background:#151f2f;border:1px dashed #42516a;border-radius:14px;padding:16px;margin:16px 0}
.drawer-item.danger{color:#ff6687}.drawer-close{margin-left:auto;background:transparent;color:#8994a6;font-size:26px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:60;display:grid;place-items:center;padding:20px}.modal-card{width:min(590px,100%);background:#0d1522;border:1px solid #263246;border-radius:22px;box-shadow:var(--shadow);padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font-size:24px}.close{background:transparent;color:#8f9aac;font-size:26px}.scanner-icon{width:42px;height:42px;border-radius:12px;background:#7657ff;display:grid;place-items:center;font-size:21px}.scan-info{margin:20px 0;background:#182132;border-radius:16px;padding:18px;color:#9ca7b9;line-height:1.5}.select{width:100%;height:58px;border-radius:14px;background:#0d1521;color:#fff;border:1px solid #273346;padding:0 14px}.progress{height:8px;background:#1a2433;border-radius:10px;overflow:hidden;margin:12px 0 20px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7657ff,#3478ff);transition:.25s}.scan{height:58px;border-radius:15px;width:100%;background:linear-gradient(100deg,#6d55ff,#2d83ff);color:#fff;font-weight:900}.scan-result{margin-top:18px;background:#151f2f;border-radius:16px;padding:17px}.scan-result b{color:#8e80ff}
.history{padding:18px}.history h3{margin-top:0}.trade-item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.green{color:var(--green)}.red{color:var(--red)}
.theme-light{--bg:#f2f5f8;--panel:#fff;--panel2:#e8edf3;--line:#d5dce5;--text:#121923;--muted:#627084}.theme-light .app,.theme-light .topbar,.theme-light .tabs,.theme-light .controls,.theme-light .bottom,.theme-light .modebar,.theme-light .drawer-panel{background:#fff}.theme-light .chart,.theme-light .balance,.theme-light .digit,.theme-light .chart-card,.theme-light .risk{background:#eef2f6;color:#121923}.theme-light .modal-card{background:#fff;color:#121923}.theme-light .field input{background:#fff;color:#111}.theme-light .auth{background:#f2f5f8}
@media(max-width:560px){.auth{padding:28px 22px 55px}.brand{margin:25px 0 45px}.brand h1{font-size:35px}.logo{width:62px;height:62px}.auth h2{font-size:42px}.auth .sub{font-size:18px}.topbar{padding:0 9px;gap:8px}.app-name{font-size:21px}.balance{padding:0 9px;font-size:13px}.deposit{padding:0 13px}.bell{display:none}.tabs{height:70px}.tab{font-size:14px}.chart{height:clamp(230px,42dvh,365px)}.digits{gap:4px}.digit{height:62px;border-width:3px}.digit strong{font-size:17px}.digit small{font-size:9px}.stake-row{grid-template-columns:52px 1fr 52px 1.15fr;min-height:68px}.risk{padding:8px 5px}.risk strong{font-size:20px}.trade-actions{height:70px}.trade-btn{font-size:23px}}
@media(max-width:390px){.app-name{display:none}.balance{margin-left:auto}.deposit{font-size:13px}.digits{gap:2px}.digit{height:55px}.digit strong{font-size:15px}.digit small{font-size:8px}}

/* Fixed terminal viewport: no page zoom and no dashboard swipe/scroll. */
html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
body{position:fixed;inset:0}
.app{width:100%;height:100%;height:100dvh;min-height:0;max-height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none}
.app *{overscroll-behavior:none}
input,textarea,select,button{font-size:16px;touch-action:manipulation;-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}
.drawer,.modal{touch-action:auto;overflow:hidden}
.drawer-panel,.modal-card{max-height:100dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.market{min-height:0;overflow:hidden!important;touch-action:none}
.chart{min-height:0}
@media(max-height:740px){
  .top{height:58px;min-height:58px}
  .tabs{height:58px;min-height:58px}
  .market{padding-top:6px}
  .chart{height:clamp(190px,34dvh,280px)}
  .digits{padding-top:5px}
  .digit{height:54px}
  .controls{padding-top:2px}
  .modebar{height:54px}
  .stake-row{min-height:58px}
  .risk{padding:5px}
  .risk-input{font-size:20px}
  .status{height:45px}
  .trade-actions{height:58px;min-height:58px}
  .bottom{height:56px;min-height:56px}
}
@media(max-width:380px){
  .chart{height:clamp(175px,31dvh,245px)}
  .digit{height:50px}
  .digit strong{font-size:16px}
  .digit small{font-size:9px}
  .modebar{height:48px}
  .stake-row{grid-template-columns:42px 1fr 42px 1fr;min-height:52px}
  .trade-actions{height:54px;min-height:54px}
  .bottom{height:52px;min-height:52px}
}

.volatility-strip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:7px 12px;background:#0b121b;border-bottom:1px solid #202b3c;touch-action:pan-x}.volatility-strip::-webkit-scrollbar{display:none}.vol-chip{flex:0 0 auto;padding:8px 10px;border-radius:10px;background:#111a27;border:1px solid #263347;color:#aeb8c8;font-size:11px;font-weight:900}.vol-chip.active{border-color:var(--green);color:var(--green);background:rgba(0,200,150,.08)}

async function supabaseAuth(path,body){
  const res=await fetch(SUPABASE_URL+"/auth/v1/"+path,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY

    body:JSON.stringify(body)

  let data=null;

  return data;
}

function contractProfitRateForSide(side){
  if(state.contract==="match"){
    const s=digitStatsForTicks(state.ticks);
    const p=Math.max(0.01,(s.pct[state.targetDigit]||10)/100);
    return side==="matches"?Math.max(0.25,Math.min(8.5,(1/p)*0.95-1)):Math.max(0.05,Math.min(8.5,(1/Math.max(.01,1-p))*0.95-1));
  }
  if(state.contract==="overunder"){
    const s=digitStatsForTicks(state.ticks),d=state.targetDigit;
    const under=s.pct.slice(0,d+1).reduce((a,b)=>a+b,0)/100;
    const p=side==="over"?Math.max(.01,1-under):Math.max(.01,under);
    return Math.max(0.05,Math.min(8.5,(1/p)*0.95-1));
  }
  return 0.952;
}

function stopTrade(reason="Manual stop", showResult=false){
  if(!state.running)return;
  const finalPnl=state.tradePnl;
  const finalSide=state.side;
  state.running=false;
  state.pendingManual=false;
  if(finalPnl!==0){
    state.history.unshift({
      time:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}),
      side:finalSide,pnl:finalPnl,reason
    });
  }
  state.side=null;
  state.tradePnl=0;
  if(state.timer){clearInterval(state.timer);state.timer=null}
  if(showResult && finalPnl!==0)showTradeResult(finalPnl,finalSide);
  renderApp();

function contractWin(side,digit){
  if(state.contract==="evenodd")return side==="even"?digit%2===0:digit%2===1;
  if(state.contract==="match")return side==="matches"?digit===state.targetDigit:digit!==state.targetDigit;
  if(state.contract==="overunder")return side==="over"?digit>state.targetDigit:digit<state.targetDigit;
  return false;
}
function settleTick(digit){
  if(!state.running)return;
  const win=contractWin(state.side,digit);
  const baseRate=state.contract==="evenodd"?0.952:contractProfitRateForSide(state.side);
  const mult=state.tradeMode==="auto"?clamp(Math.round(state.multiplier||1),1,10):1;
  const delta=win?state.stake*baseRate*mult:-state.stake;
  state.tradePnl=+(state.tradePnl+delta).toFixed(2);

  if(state.tradeMode==="manual"){
    state.demo=+(state.demo+delta).toFixed(2);
    if(win)state.sessionWins++;else state.sessionLosses++;
    const finalPnl=state.tradePnl, finalSide=state.side;
    state.history.unshift({time:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}),side:finalSide,pnl:finalPnl,reason:win?"Trade won":"Trade lost"});
    saveUserData();
    stopTrade(win?"Trade won":"Trade lost",true);
    return;
  }

  const targetReached=state.tradePnl>=state.takeProfit||state.tradePnl<=-Math.abs(state.stopLoss);
  if(targetReached){
    const won=state.tradePnl>=state.takeProfit;
    if(won)state.sessionWins++;else state.sessionLosses++;
    const finalPnl=state.tradePnl, finalSide=state.side;
    state.demo=+(state.demo+finalPnl).toFixed(2);
    state.history.unshift({time:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}),side:finalSide,pnl:finalPnl,reason:won?"Target reached":"Stop loss reached"});
    saveUserData();
    stopTrade(won?"Target reached":"Stop loss reached",true);
    return;
  }
  saveUserData();
  updateLiveUI();
}
function tick(){
  const last=state.ticks.length?state.ticks[state.ticks.length-1].value:10000;
  const value=+(last+(Math.random()-.5)*9).toFixed(2);
  const digit=Math.floor(Math.abs(Math.round(value*100)))%10;
  state.ticks.push({value,digit});if(state.ticks.length>65)state.ticks.shift();state.lastDigit=digit;
  if(state.running)settleTick(digit);
  else {updateLiveUI()}
}
function renderDigits(){
  const ticks=state.ticks.slice(-120);
  const weights=Array(10).fill(0);
  ticks.forEach((t,i)=>{
    const age=ticks.length-1-i;
    const w=Math.exp(-age/45);
    weights[t.digit]+=w;
  });
  const total=weights.reduce((a,b)=>a+b,0)||1;
  const digits=document.getElementById("digits");
  if(!digits)return;
  const pct=weights.map(v=>v/total*100);
  const ranked=pct.map((p,i)=>({i,p})).sort((a,b)=>b.p-a.p);
  const maxP=ranked[0]?.i, secondP=ranked[1]?.i;
  const minP=ranked[9]?.i, secondMinP=ranked[8]?.i;
  digits.innerHTML=pct.map((p,i)=>{
    const current=i===state.lastDigit;
    let cls=current?"current":"";
    if(current && state.running) cls+=" "+(contractWin(state.side,i)?"win":"loss");
    if(i===maxP)cls+=" hot";
    else if(i===secondP)cls+=" warm";
    else if(i===minP)cls+=" cold";
    else if(i===secondMinP)cls+=" cool";
    return `<div class="digit ${cls}"><strong>${i}</strong><small>${p.toFixed(1)}%</small></div>`;
  }).join("");
}

function updateChartScale(){
  const level=(VOLATILITY_CATALOG[state.volatilityIndex]||VOLATILITY_CATALOG[0]).level;

function formatChartTime(ts){
  const d=new Date(ts);
  return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
}
function getChartPoints(){
  return state.ticks.slice(-180).map((t,i)=>({
    ts:(Number(t.epoch)||Math.floor(Date.now()/1000)-220+i)*1000,
    value:Number(t.value)
  })).filter(p=>Number.isFinite(p.value));
}
function drawChart(){
  const svg=document.getElementById("chartSvg");
  if(!svg)return;
  const points=getChartPoints();
  const W=1100,H=410,left=10,right=86,top=22,bottom=30;
  if(points.length<2){
    svg.innerHTML="";
    let empty=document.querySelector(".chart-live-empty");
    if(!empty){
      empty=document.createElement("div");
      empty.className="chart-live-empty";
      empty.textContent="Waiting for live market ticks…";
      svg.parentElement.appendChild(empty);
    }
    const price=document.getElementById("price");
    if(price)price.textContent="—";
    return;
  }
  const empty=document.querySelector(".chart-live-empty");if(empty)empty.remove();

  const vals=points.map(p=>p.value);
  const current=vals[vals.length-1];
  const first=vals[0];
  const rawMin=Math.min(...vals),rawMax=Math.max(...vals);
  const rawSpan=Math.max(rawMax-rawMin,Number(state.pipSize)||0.01);
  const pad=Math.max(rawSpan*.10,(Number(state.pipSize)||0.01)*4);
  const min=rawMin-pad,max=rawMax+pad,range=Math.max(max-min,1e-9);
  const plotW=W-left-right,plotH=H-top-bottom;

  const pts=vals.map((v,i)=>({
    x:left+i*plotW/Math.max(1,vals.length-1),
    y:top+(max-v)/range*plotH
  }));
  let linePath=`M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    linePath+=` C ${c1x.toFixed(2)} ${c1y.toFixed(2)},${c2x.toFixed(2)} ${c2y.toFixed(2)},${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  const areaPath=`${linePath} L ${left+plotW} ${top+plotH} L ${left} ${top+plotH} Z`;

  let grid="";
  for(let x=0;x<=10;x++){
    const xx=left+x*plotW/10;
    grid+=`<line x1="${xx}" y1="${top}" x2="${xx}" y2="${top+plotH}" stroke="#1b2737" stroke-width="1"/>`;
  }
  for(let y=0;y<=6;y++){
    const yy=top+y*plotH/6;
    grid+=`<line x1="${left}" y1="${yy}" x2="${left+plotW}" y2="${yy}" stroke="#1b2737" stroke-width="1"/>`;
  }

  const lastY=pts[pts.length-1].y;
  const change=first?((current-first)/first*100):0;
  const color=change>=0?'#00c896':'#ff4d72';
  const fillId="chartFillReal";
  svg.innerHTML=`<defs><linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#aeb7c6" stop-opacity=".14"/><stop offset="100%" stop-color="#aeb7c6" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${areaPath}" fill="url(#${fillId})"/>
    <path d="${linePath}" fill="none" stroke="#d9dee7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${left+plotW}" cy="${lastY}" r="4" fill="#d9dee7"/>
    <line x1="${left+plotW-110}" y1="${lastY}" x2="${left+plotW}" y2="${lastY}" stroke="#2aaea1" stroke-width="1.5" stroke-dasharray="4 4"/>`;

  const timeLabel=document.getElementById("chartTimeLabel");
  if(timeLabel)timeLabel.textContent=formatChartTime(points[0].ts)+"  →  "+formatChartTime(points[points.length-1].ts);
  const price=document.getElementById("price");
  if(price){
    price.textContent=formatQuote(current);
    price.style.top=`${Math.max(14,Math.min(90,lastY/H*100))}%`;
  }
  const quote=document.getElementById("quote");
  if(quote)quote.innerHTML=`${formatQuote(current)} <i style="color:${color}">${change>=0?'+':''}${change.toFixed(2)}%</i>`;

  const labels=document.querySelector(".chart-grid-labels");
  if(labels){
    labels.innerHTML="";
    for(let i=0;i<5;i++){
      const v=max-(max-min)*i/4;
      const s=document.createElement("span");
      s.textContent=formatQuote(v);
      labels.appendChild(s);
    }
  }
}

function digitFromQuote(quote,pipSize){
  const n=Number(quote);
  if(!Number.isFinite(n))return null;
  const p=Number(pipSize);
  const decimals=Number.isFinite(p)&&p>0 ? Math.max(0,Math.min(8,Math.round(-Math.log10(p)))) : 2;
  const fixed=n.toFixed(decimals);
  const last=fixed.replace(/[^0-9]/g,"").slice(-1);
  const d=Number(last);
  return Number.isFinite(d)?d:null;
}
function formatQuote(value,pipSize=state.pipSize){
  const p=Number(pipSize);
  const decimals=Number.isFinite(p)&&p>0 ? Math.max(0,Math.min(8,Math.round(-Math.log10(p)))) : 2;
  return Number(value).toFixed(decimals);
}

function digitStatsForTicks(ticks){
  const clean=ticks.filter(t=>Number.isFinite(t.value)&&Number.isInteger(t.digit));
  const counts=Array(10).fill(0);
  clean.forEach(t=>counts[t.digit]++);
  const total=Math.max(1,clean.length);
  const pct=counts.map(c=>c/total*100);
  const recent=clean.slice(-40);
  const recentCounts=Array(10).fill(0);recent.forEach(t=>recentCounts[t.digit]++);
  const recentTotal=Math.max(1,recent.length);
  const recentPct=recentCounts.map(c=>c/recentTotal*100);
  const even=pct[0]+pct[2]+pct[4]+pct[6]+pct[8];
  const odd=100-even;
  const recentEven=recentPct[0]+recentPct[2]+recentPct[4]+recentPct[6]+recentPct[8];
  const recentOdd=100-recentEven;
  const entropy=-pct.reduce((sum,p)=>sum+(p>0?(p/100)*Math.log2(p/100):0),0)/Math.log2(10);
  const volatility=clean.length>2 ? Math.sqrt(clean.slice(1).reduce((sum,t,i)=>sum+Math.pow(t.value-clean[i].value,2),0)/(clean.length-1)) : 0;
  return {counts,pct,recentPct,even,odd,recentEven,recentOdd,entropy,volatility,total:clean.length};
}

function scannerQuality(contract,ticks){
  const s=digitStatsForTicks(ticks);
  if(s.total<25)return null;
  let label='Wait', edge=0,stability=0,shift=0,explanation='';
  if(contract==='Even / Odd'){
    const parity=s.even>=50?'Even':'Odd';
    const p=parity==='Even'?s.even:s.odd;
    const recentP=parity==='Even'?s.recentEven:s.recentOdd;
    edge=Math.abs(p-50);
    shift=Math.abs(recentP-p);
    stability=100-Math.abs(50-s.even)*1.2;
    label=parity;
    explanation=`${parity} ${p.toFixed(1)}% · recent ${recentP.toFixed(1)}%`;
  }else if(contract==='Matches / Differs'){
    const ranked=s.pct.map((p,d)=>({d,p})).sort((a,b)=>a.p-b.p);
    const cold=ranked[0],hot=ranked[9];
    // A differs setup is strongest when one digit is unusually infrequent and the edge persists in recent ticks.
    const coldRecent=s.recentPct[cold.d];
    const differsProb=100-cold.p;
    edge=Math.max(0,differsProb-90);
    shift=Math.abs(coldRecent-cold.p);
    stability=Math.max(0,100-Math.abs(coldRecent-cold.p)*4);
    label=`Differs ${cold.d}`;
    explanation=`digit ${cold.d}: ${cold.p.toFixed(1)}% overall · ${coldRecent.toFixed(1)}% recent; hot ${hot.d}`;
  }else{
    let best=null;
    for(let d=0;d<=9;d++){
      const under=s.pct.slice(0,d+1).reduce((a,b)=>a+b,0);
      const over=100-under;
      const recentUnder=s.recentPct.slice(0,d+1).reduce((a,b)=>a+b,0);
      const recentOver=100-recentUnder;
      const candidates=[{dir:'Under',p:under,recent:recentUnder},{dir:'Over',p:over,recent:recentOver}];
      for(const c of candidates){
        const e=Math.abs(c.p-50);
        if(!best||e>best.edge)best={d,dir:c.dir,p:c.p,recent:c.recent,edge:e};
      }
    }
    label=`${best.dir} ${best.d}`;
    edge=best.edge;shift=Math.abs(best.recent-best.p);stability=Math.max(0,100-shift*4);
    explanation=`${best.dir} ${best.d}: ${best.p.toFixed(1)}% overall · ${best.recent.toFixed(1)}% recent`;
  }
  // Signal quality is a composite score, not a guaranteed win probability.
  const quality=clamp(55 + edge*4 + stability*.18 + s.entropy*7 - Math.min(8,shift*.5),55,99.5);
  return {label,quality,explanation,stats:s};
}

function requestPublicHistory(symbol, endpoint){
  return new Promise((resolve)=>{
    let ws=null,done=false;
    const finish=(result)=>{if(done)return;done=true;clearTimeout(timer);try{ws?.close()}catch{};resolve(result||[])}
    const timer=setTimeout(()=>finish([]),4500);
    try{ws=new WebSocket(endpoint)}catch{finish([]);return}
    ws.onopen=()=>{
      ws.send(JSON.stringify({
        ticks_history:symbol,count:200,end:"latest",style:"ticks",subscribe:0,req_id:1
      }));
    };
    ws.onmessage=(ev)=>{
      try{
        const d=JSON.parse(ev.data);
        if(d.error){finish([]);return}
        if(d.msg_type!=="history"||!Array.isArray(d.history?.prices))return;
        const prices=d.history.prices;
        const times=d.history.times||[];
        const pip=d.history.pip_size??d.pip_size??0.01;
        const rows=prices.map((price,i)=>({
          value:Number(price),
          digit:digitFromQuote(price,pip),
          epoch:times[i]
        })).filter(x=>Number.isFinite(x.value)&&Number.isInteger(x.digit));
        finish(rows);
      }catch{}
    };
    ws.onerror=()=>finish([]);
  });
}
async function publicHistoryForScanner(symbols,onProgress){
  const endpoints=[DERIV_PUBLIC_WS,DERIV_PUBLIC_WS_FALLBACK];
  const results={};
  let done=0;
  const queue=symbols.map((symbol,index)=>({symbol,index}));
  const workers=Array.from({length:Math.min(4,symbols.length)},async()=>{
    while(queue.length){
      const job=queue.shift();
      if(!job)break;
      let rows=[];
      for(const endpoint of endpoints){
        rows=await requestPublicHistory(job.symbol,endpoint);
        if(rows.length>=25)break;
      }
      results[job.symbol]=rows;
      done++;
      if(onProgress)onProgress(done,symbols.length);
    }
  });
  await Promise.all(workers);
  return results;
}

function openScanner(){
  const m=document.createElement('div');m.className='modal scanner-modal';
  m.innerHTML=`<div class='modal-card scanner-card'>
    <div class='scanner-head'><div class='scanner-title'><div class='scanner-icon'>✧</div><h3>Entry Scanner</h3></div><button class='close'>×</button></div>
    <div class='scanner-body'>
      <label class='scanner-label'>Market</label>
      <select class='scanner-market' id='scanMarket'><option>Matches / Differs</option><option>Even / Odd</option><option>Over / Under</option></select>
      <div class='scanner-label best-label'>Best Match</div>
      <div class='best-match'><b id='bestMarket'>Scanning…</b><small id='bestEntry'>Comparing 13 volatility markets using live tick history</small></div>
      <div class='scan-progress-row'><b id='scanState'>Scanning markets</b><span id='scanCount'>0/13</span></div>
      <div class='progress scanner-progress'><i id='scanProgress'></i></div>
      <div class='quality' id='scanQuality'><span class='scan-spinner'>◌</span><b>Reading live tick history…</b></div>
      <button class='scan scanner-rescan' id='scanGo'>↻ &nbsp; Re-scan</button>
      <button class='load-market' id='loadMarket' disabled>Load selected volatility</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.querySelector('.close').onclick=()=>m.remove();

  const symbols=Object.values(DERIV_SYMBOLS),names=Object.keys(DERIV_SYMBOLS);
  let best=null,scanRunning=false;

  const runScan=async()=>{
    if(scanRunning)return;
    scanRunning=true;best=null;
    const bar=m.querySelector('#scanProgress'),count=m.querySelector('#scanCount'),
      q=m.querySelector('#scanQuality'),go=m.querySelector('#scanGo'),
      load=m.querySelector('#loadMarket'),stateLabel=m.querySelector('#scanState');

    go.disabled=true;load.disabled=true;bar.style.width='0%';count.textContent='0/13';
    stateLabel.textContent='Scanning markets';
    q.innerHTML='<span class="scan-spinner">◌</span><b>Reading live tick history…</b>';

    const contract=m.querySelector('#scanMarket').value;
    const data=await publicHistoryForScanner(symbols,(n,total)=>{
      bar.style.width=((n/total)*100)+'%';
      count.textContent=n+'/'+total;
      q.innerHTML=`<span class="scan-spinner">◌</span><b>Analyzing ${n}/${total} markets…</b>`;
    });

    for(let i=0;i<symbols.length;i++){
      const symbol=symbols[i],ticks=data[symbol]||[];
      const result=scannerQuality(contract,ticks);
      if(result){
        const candidate={symbol,name:names[i],...result};
        candidate.score=(candidate.quality||0)+(candidate.stats?.total?Math.min(2,candidate.stats.total/100):0);if(!best||candidate.score>best.score)best=candidate;
      }
    }

    if(best){
      stateLabel.textContent='Scan complete';
      m.querySelector('#bestMarket').textContent=best.name.replace(' Index','');
      m.querySelector('#bestEntry').innerHTML=`${esc(contract)} · <strong>${esc(best.label)}</strong><br><span>${esc(best.explanation)}</span>`;
      q.innerHTML=`<span class='quality-check'>✓</span><b>Quality ${best.quality.toFixed(2)}%</b><span> · current market fit</span>`;
      load.disabled=false;
      load.textContent=`Load ${best.name.replace(' Index','')}`;
      load.onclick=()=>{
        const idx=VOLATILITY_CATALOG.findIndex(v=>v.name===best.name);
        if(idx>=0){
          state.volatilityIndex=idx;
          if(contract==="Even / Odd") state.recommendedSide=best.label;
          else if(contract==="Matches / Differs"){state.recommendedSide=best.label.startsWith("Differs")?"differs":"matches";state.targetDigit=Number((best.label.match(/\d+/)||[state.targetDigit])[0]);}
          else{state.recommendedSide=best.label.startsWith("Under")?"under":"over";state.targetDigit=Number((best.label.match(/\d+/)||[state.targetDigit])[0]);}
          startDerivPublicStream();
          m.remove();
          renderApp();
        }
      };
    }else{
      stateLabel.textContent='Scan unavailable';
      m.querySelector('#bestMarket').textContent='No market data available';
      m.querySelector('#bestEntry').textContent='Check the connection and re-scan.';
      q.innerHTML='<span>!</span><b>Live market data could not be read</b>';
    }
    go.disabled=false;go.textContent='↻  Re-scan';scanRunning=false;
  };
  m.querySelector('#scanMarket').onchange=runScan;
  m.querySelector('#scanGo').onclick=runScan;
  runScan();
}

async function loadUserData(){
  const uid=state.user?.id;if(!uid)return;
  const key="th_user_"+uid;
  try{const saved=JSON.parse(localStorage.getItem(key)||"{}");Object.assign(state,{demo:saved.demo??10000,real:saved.real??0,history:saved.history??[],multiplier:clamp(Math.round(saved.multiplier??state.multiplier??1),1,10)})}catch{}
}
function saveUserData(){
  const uid=state.user?.id;if(!uid)return;
  localStorage.setItem("th_user_"+uid,JSON.stringify({demo:state.demo,real:state.real,history:state.history,multiplier:clamp(Math.round(state.multiplier||1),1,10)}));
}


const DERIV_PUBLIC_WS="wss://api.derivws.com/trading/v1/options/ws/public";
const DERIV_PUBLIC_WS_FALLBACK="wss://ws.binaryws.com/websockets/v3";
const DERIV_SYMBOLS={
  "Volatility 10 (1s) Index":"1HZ10V",
  "Volatility 10 Index":"R_10",
  "Volatility 15 (1s) Index":"1HZ15V",
  "Volatility 25 (1s) Index":"1HZ25V",
  "Volatility 25 Index":"R_25",
  "Volatility 30 (1s) Index":"1HZ30V",
  "Volatility 50 (1s) Index":"1HZ50V",
  "Volatility 50 Index":"R_50",
  "Volatility 75 (1s) Index":"1HZ75V",
  "Volatility 75 Index":"R_75",
  "Volatility 90 (1s) Index":"1HZ90V",
  "Volatility 100 (1s) Index":"1HZ100V",
  "Volatility 100 Index":"R_100"
};
let derivWs=null;
let derivReconnect=null;
let derivEndpointIndex=0;

function selectedDerivSymbol(){
  const v=VOLATILITY_CATALOG[state.volatilityIndex];
  return DERIV_SYMBOLS[v?.name]||"1HZ10V";
}
function handleDerivMessage(data){
  if(data.msg_type==="history" && Array.isArray(data.history?.prices)){
    const prices=data.history.prices;
    const times=data.history.times||[];
    state.pipSize=Number(data.history.pip_size??data.pip_size??state.pipSize)||state.pipSize;
    state.ticks=prices.map((price,i)=>({
      value:Number(price),
      digit:digitFromQuote(price,state.pipSize),
      epoch:times[i]
    })).filter(t=>Number.isFinite(t.value)&&Number.isInteger(t.digit)).slice(-1000);
    if(state.ticks.length)state.lastDigit=state.ticks[state.ticks.length-1].digit;
    updateLiveUI();
    return;
  }
  if(data.msg_type==="tick" && data.tick){
    const value=Number(data.tick.quote);
    if(!Number.isFinite(value))return;
    const pip=Number(data.tick.pip_size)||state.pipSize||0.01;
    if(Number.isFinite(data.tick.pip_size))state.pipSize=data.tick.pip_size;
    const digit=digitFromQuote(data.tick.quote,pip);
    if(digit===null)return;
    state.ticks.push({value,digit,epoch:data.tick.epoch});
    if(state.ticks.length>1000)state.ticks.shift();
    state.lastDigit=digit;
    if(state.running)settleTick(digit); else updateLiveUI();
  }
}
function startDerivPublicStream(){
  if(derivWs){try{derivWs.close()}catch{}}
  clearTimeout(derivReconnect);
  const symbol=selectedDerivSymbol();
  const endpoint=derivEndpointIndex===1?DERIV_PUBLIC_WS_FALLBACK:DERIV_PUBLIC_WS;
  let connected=false;
  derivWs=new WebSocket(endpoint);
  derivWs.onopen=()=>{
    connected=true;
    derivWs.send(JSON.stringify({ticks_history:symbol,count:300,end:"latest",style:"ticks",subscribe:1,req_id:101}));
    derivWs.send(JSON.stringify({ticks:symbol,subscribe:1,req_id:102}));
  };
  derivWs.onmessage=(ev)=>{
    try{handleDerivMessage(JSON.parse(ev.data))}catch{}
  };
  derivWs.onerror=()=>{
    if(derivEndpointIndex===0){
      derivEndpointIndex=1;
      try{derivWs.close()}catch{}
    }
  };
  derivWs.onclose=()=>{
    if(!connected && derivEndpointIndex===0){
      derivEndpointIndex=1;
      clearTimeout(derivReconnect);
      derivReconnect=setTimeout(startDerivPublicStream,200);
      return;
    }
    clearTimeout(derivReconnect);
    derivReconnect=setTimeout(startDerivPublicStream,2500);
  };
}

// Restore a saved session locally. No Supabase JavaScript SDK is required.
const savedAuth=getSavedSession();
state.session=savedAuth.session;
state.user=savedAuth.user;
if(state.user && state.session){
  loadUserData().then(()=>renderApp()).catch(()=>renderApp());
}else{
  renderAuth();
}
state.ticks=[];
{
  const level=(VOLATILITY_CATALOG[state.volatilityIndex]||VOLATILITY_CATALOG[0]).level||10;
  let value=10000;
  for(let i=0;i<220;i++){
    const sigma=0.16+level*0.0038;
    const drift=(10000-value)*0.0006;
    const shock=(Math.random()-0.5)*sigma;
    value=+(value+drift+shock).toFixed(3);
    const digit=Math.abs(Math.round(value*100))%10;
    state.ticks.push({value,digit,epoch:Date.now()-(220-i)*1000});
  }
}
state.lastDigit=state.ticks[state.ticks.length-1].digit;
setInterval(()=>{if(!derivWs || derivWs.readyState!==WebSocket.OPEN) tick()},1000);
setInterval(saveUserData,5000);
setTimeout(startDerivPublicStream,250);
</script>
