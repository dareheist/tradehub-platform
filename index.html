.menu{width:45px;height:45px;background:transparent;color:#a5afc0;font-size:28px}.app-logo{width:47px;height:47px;border-radius:12px;background:var(--green);color:#03120e;display:grid;place-items:center;font-weight:1000;font-size:21px}

.risk-row{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line)}.risk{padding:16px;text-align:center;border-right:1px solid var(--line)}.risk:last-child{border:0}.risk small{display:block;font-weight:900;margin-bottom:6px}.risk.profit small{color:var(--green)}.risk.loss small{color:#ff5a83}.risk.mult small{color:#ffc400}.risk strong{font-size:24px}.risk-input{width:100%;max-width:120px;margin:auto;background:transparent;border:1px solid transparent;border-radius:10px;color:inherit;text-align:center;font-size:24px;font-weight:900;padding:5px 3px;outline:none}.risk-input:focus{border-color:var(--green);background:rgba(255,255,255,.04)}.risk-input::-webkit-outer-spin-button,.risk-input::-webkit-inner-spin-button{margin:0}.mode{cursor:pointer;transition:.2s}.mode.active{color:var(--green);background:rgba(0,200,150,.08);box-shadow:inset 0 -2px 0 var(--green)}
.status{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;color:#748096}.status strong{font-size:18px}.status .positive{color:var(--green)}.status .negative{color:var(--red)}
.trade-actions{display:grid;grid-template-columns:1fr 1fr;height:92px}.trade-btn{font-size:25px;font-weight:1000;color:#fff}.even{background:#00c896}.odd{background:#ff2059}.trade-btn.running{background:var(--orange)!important;color:#fff}.trade-btn:disabled{opacity:.55}

.setting-grid{display:grid;gap:14px;margin-top:16px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:#151f2f;border:1px solid #273449;border-radius:13px}.setting-row input{width:100%;max-width:260px;height:46px;background:#0e1723;border:1px solid #2a374a;border-radius:10px;color:#fff;padding:0 12px}.setting-row small{display:block;color:#8f9caf;margin-top:3px}.setting-note{color:#8f9caf;line-height:1.5}.toggle{width:52px;height:30px;border-radius:20px;background:#293548;position:relative;padding:0}.toggle i{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#a8b2c0;transition:.2s}.toggle.on{background:rgba(0,200,150,.35)}.toggle.on i{left:26px;background:var(--green)}
.responsible-card{background:#151f2f;border:1px solid #273449;border-radius:14px;padding:15px;margin-top:14px}.responsible-card h4{margin:0 0 7px}.limit-row{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;margin-top:12px}.limit-row input{height:45px;background:#0e1723;border:1px solid #2a374a;border-radius:10px;color:#fff;padding:0 10px}

.drawer-item.danger{color:#ff6687}.drawer-close{margin-left:auto;background:transparent;color:#8994a6;font-size:26px}

.history{padding:18px}.history h3{margin-top:0}.trade-item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.green{color:var(--green)}.red{color:var(--red)}
.theme-light{--bg:#f2f5f8;--panel:#fff;--panel2:#e8edf3;--line:#d5dce5;--text:#121923;--muted:#627084}.theme-light .app,.theme-light .topbar,.theme-light .tabs,.theme-light .controls,.theme-light .bottom,.theme-light .modebar,.theme-light .drawer-panel{background:#fff}.theme-light .chart,.theme-light .balance,.theme-light .digit,.theme-light .chart-card,.theme-light .risk{background:#eef2f6;color:#121923}.theme-light .modal-card{background:#fff;color:#121923}.theme-light .field input{background:#fff;color:#111}.theme-light .auth{background:#f2f5f8}

/* Fixed terminal viewport: no page zoom and no dashboard swipe/scroll. */
html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
body{position:fixed;inset:0}
.app{width:100%;height:100%;height:100dvh;min-height:0;max-height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none}
.app *{overscroll-behavior:none}
input,textarea,select,button{font-size:16px;touch-action:manipulation;-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}
.drawer,.modal{touch-action:auto;overflow:hidden}
.drawer-panel,.modal-card{max-height:100dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.market{min-height:0;overflow:hidden!important;touch-action:none}
.chart{min-height:0}
@media(max-height:740px){
  .top{height:58px;min-height:58px}
  .tabs{height:58px;min-height:58px}
  .market{padding-top:6px}
  .chart{height:clamp(190px,34dvh,280px)}
  .digits{padding-top:5px}
  .digit{height:54px}
  .controls{padding-top:2px}
  .modebar{height:54px}
  .stake-row{min-height:58px}
  .risk{padding:5px}
  .risk-input{font-size:20px}
  .status{height:45px}
  .trade-actions{height:58px;min-height:58px}
  .bottom{height:56px;min-height:56px}
}
@media(max-width:380px){
  .chart{height:clamp(175px,31dvh,245px)}
  .digit{height:50px}
  .digit strong{font-size:16px}
  .digit small{font-size:9px}
  .modebar{height:48px}
  .stake-row{grid-template-columns:42px 1fr 42px 1fr;min-height:52px}
  .trade-actions{height:54px;min-height:54px}
  .bottom{height:52px;min-height:52px}
}

.volatility-strip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:7px 12px;background:#0b121b;border-bottom:1px solid #202b3c;touch-action:pan-x}.volatility-strip::-webkit-scrollbar{display:none}.vol-chip{flex:0 0 auto;padding:8px 10px;border-radius:10px;background:#111a27;border:1px solid #263347;color:#aeb8c8;font-size:11px;font-weight:900}.vol-chip.active{border-color:var(--green);color:var(--green);background:rgba(0,200,150,.08)}
.chart-meta{display:flex;align-items:flex-start;justify-content:space-between;padding:8px 14px 0}.chart-meta .instrument{font-weight:900;font-size:14px}.chart-meta .instrument small{display:block;color:#8792a6;font-size:10px;margin-top:2px}.chart-meta .scale{font-size:11px;color:#8792a6;text-align:right}.chart-meta .scale strong{display:block;color:#e7edf6;font-size:13px}
.profile-card{padding:14px 16px;border-bottom:1px solid #202b3c;display:flex;align-items:center;gap:11px}.profile-avatar{width:42px;height:42px;border-radius:50%;background:var(--green);color:#03120e;display:grid;place-items:center;font-weight:1000}.profile-card b{display:block}.profile-card small{display:block;color:#8792a6;margin-top:2px}.drawer-site{padding:13px 16px;color:#8e9bad;font-size:12px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #202b3c}.drawer-site strong{display:block;color:#e9eef6;font-size:16px;letter-spacing:0;text-transform:none;margin-top:3px}.account-list,.money-list,.history-box{display:grid;gap:10px;margin-top:14px}.panel-action{width:100%;text-align:left;padding:14px;border:1px solid #263347;border-radius:12px;background:#141e2c;color:#edf2f8;font-weight:850}.panel-action span{display:block;color:#8792a6;font-size:11px;font-weight:500;margin-top:4px}.money-option{padding:15px;border:1px solid #29374c;border-radius:13px;background:#141e2c}.money-option b{display:block}.money-option small{display:block;color:#8c98aa;margin-top:4px}.transaction-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.transaction-tab{padding:11px;border:1px solid #29374c;border-radius:10px;background:#111a27;color:#aeb8c8;font-weight:850}.transaction-tab.active{border-color:var(--green);color:var(--green);background:rgba(0,200,150,.08)}.tx-empty{text-align:center;padding:25px 10px;color:#8b96a8;border:1px dashed #29374c;border-radius:13px}.ref-share{display:grid;grid-template-columns:1fr 90px;gap:8px}.ref-share input{height:48px;background:#0e1723;border:1px solid #29374c;border-radius:10px;color:#fff;padding:0 12px}

const SUPABASE_URL = "https://xtozqmsknvevqvpiixjh.supabase.co";

// REST-only authentication. This avoids depending on a third-party Supabase
// JavaScript CDN, which was the component failing on the deployed page.
let supabase = null;

function saveAuthSession(session,user){
  if(session) localStorage.setItem("th_auth_session", JSON.stringify(session));
  if(user) localStorage.setItem("th_auth_user", JSON.stringify(user));
}
function getSavedSession(){
  try{
    const session=JSON.parse(localStorage.getItem("th_auth_session")||"null");
    const user=JSON.parse(localStorage.getItem("th_auth_user")||"null");
    return {session,user};
  }catch(e){return {session:null,user:null}}
}
function clearAuthSession(){
  localStorage.removeItem("th_auth_session");
  localStorage.removeItem("th_auth_user");
}
async function supabaseAuth(path,body){
  const res=await fetch(SUPABASE_URL+"/auth/v1/"+path,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY
    },
    body:JSON.stringify(body)
  });
  let data=null;
  try{data=await res.json()}catch(e){}
  if(!res.ok){
    const message=data?.msg||data?.message||data?.error_description||data?.error||"Authentication request failed.";
    throw new Error(message);
  }
  return data;
}
async function signInWithPassword(email,password){
  const data=await supabaseAuth("token?grant_type=password",{email,password});
  return {data:{session:data,user:data.user}};
}
async function signUp(email,password,name){
  const data=await supabaseAuth("signup",{email,password,data:{full_name:name}});
  return {data:{session:data.session||null,user:data.user||null}};
}
async function resetPassword(email,redirectTo){
  return await supabaseAuth("recover",{email,redirect_to:redirectTo});
}
async function signOut(){
  const saved=getSavedSession();
  if(saved.session?.access_token){
    try{
      await fetch(SUPABASE_URL+"/auth/v1/logout",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+saved.session.access_token
        }
      });
    }catch(e){}
  }
  clearAuthSession();
}

async function handleAuth(e){
  e.preventDefault();
  const msg=document.getElementById("authMsg");
  msg.textContent="";
  msg.className="msg";
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email || !password){
    msg.textContent="Enter your email and password.";
    return;
  }

  try{
    if(state.auth==="login"){
      const result=await signInWithPassword(email,password);
      state.session=result.data.session;
      state.user=result.data.user;
      saveAuthSession(state.session,state.user);
      await loadUserData();
      renderApp();
    }else{
      const name=document.getElementById("name").value.trim();
      const result=await signUp(email,password,name);
      state.session=result.data.session;
      state.user=result.data.user;

      if(state.session){
        saveAuthSession(state.session,state.user);
        await loadUserData();
        renderApp();
      }else{
        msg.textContent="Account created. Check your email if email confirmation is enabled.";
        msg.className="msg ok";
      }
    }
  }catch(err){
    msg.textContent=err.message||"Authentication failed.";
  }
}

async function forgotPassword(){
  const email=document.getElementById("email").value.trim();
  const msg=document.getElementById("authMsg");
  if(!email){msg.textContent="Enter your email first.";return}
  try{
    const redirect=location.href.split("#")[0];
    await resetPassword(email,redirect);
    msg.textContent="Password reset email sent.";
    msg.className="msg ok";
  }catch(err){
    msg.textContent=err.message||"Could not send the reset email.";
  }
}

async function logout(){
  await signOut();
  state.session=null;
  state.user=null;
  stopTrade();
  renderAuth();
}

  stakeInput.oninput=()=>{const v=Number(stakeInput.value);if(Number.isFinite(v)&&v>=.01)state.stake=clamp(+v.toFixed(2),.01,10000)};
  stakeInput.onchange=commitStake; stakeInput.onblur=commitStake;

  tp.onchange=()=>{if(state.running)return renderApp();const v=Number(tp.value);if(Number.isFinite(v)&&v>0)state.takeProfit=+v.toFixed(2);renderApp()};
  sl.onchange=()=>{if(state.running)return renderApp();const v=Number(sl.value);if(Number.isFinite(v)&&v>0)state.stopLoss=+v.toFixed(2);renderApp()};

function placeOrStop(side){
  if(state.running){if(state.tradeMode==="auto"&&state.side===side)stopTrade("Manual stop");return}
  if(state.mode==="real"){alert("Real-money execution is not connected in this safe build. Switch to Demo until a compliant server-side payment/trading backend is connected.");return}
  startTrade(side);
}
function startTrade(side){
  if(state.stake>state.demo){alert("Demo balance is too low for this stake.");return}
  state.side=side;state.running=true;state.tradeStartedAt=Date.now();state.tradeStartBalance=state.demo;state.tradePnl=0;
  renderApp();
}
function stopTrade(reason="Manual stop"){
  if(!state.running)return;
  state.running=false;
  if(state.tradePnl!==0){
    state.history.unshift({time:new Date().toLocaleTimeString(),side:state.side,pnl:state.tradePnl,reason});
  }
  state.side=null;state.tradePnl=0;
  if(state.timer){clearInterval(state.timer);state.timer=null}
  renderApp();
}
function contractWin(side,digit){
  if(state.contract==="evenodd")return side==="even"?digit%2===0:digit%2===1;
  if(state.contract==="match")return side==="matches"?digit===state.targetDigit:digit!==state.targetDigit;
  if(state.contract==="overunder")return side==="over"?digit>state.targetDigit:digit<state.targetDigit;
  return false;
}
function settleTick(digit){
  if(!state.running)return;
  const win=contractWin(state.side,digit);
  const delta=win?state.stake*.975*state.multiplier:-state.stake;
  state.demo=+(state.demo+delta).toFixed(2);state.tradePnl=+(state.tradePnl+delta).toFixed(2);
  if(win)state.sessionWins++;else state.sessionLosses++;
  const targetReached=state.tradePnl>=state.takeProfit||state.tradePnl<=-Math.abs(state.stopLoss);
  if(targetReached){stopTrade(state.tradePnl>=state.takeProfit?"Take profit reached":"Stop loss reached");return}
  updateLiveUI();
}
function tick(){
  const last=state.ticks.length?state.ticks[state.ticks.length-1].value:10000;
  const value=+(last+(Math.random()-.5)*9).toFixed(2);
  const digit=Math.floor(Math.abs(Math.round(value*100)))%10;
  state.ticks.push({value,digit});if(state.ticks.length>65)state.ticks.shift();state.lastDigit=digit;
  if(state.running)settleTick(digit);
  else {updateLiveUI()}
}
function renderDigits(){
  const ticks=state.ticks.slice(-120);
  const weights=Array(10).fill(0);
  ticks.forEach((t,i)=>{
    const age=ticks.length-1-i;
    const w=Math.exp(-age/45);
    weights[t.digit]+=w;
  });
  const total=weights.reduce((a,b)=>a+b,0)||1;
  const digits=document.getElementById("digits");
  if(!digits)return;
  const pct=weights.map(v=>v/total*100);
  const ranked=pct.map((p,i)=>({i,p})).sort((a,b)=>b.p-a.p);
  const maxP=ranked[0]?.i, secondP=ranked[1]?.i;
  const minP=ranked[9]?.i, secondMinP=ranked[8]?.i;
  digits.innerHTML=pct.map((p,i)=>{
    const current=i===state.lastDigit;
    let cls=current?"current":"";
    if(current && state.running) cls+=" "+(contractWin(state.side,i)?"win":"loss");
    if(i===maxP)cls+=" hot";
    else if(i===secondP)cls+=" warm";
    else if(i===minP)cls+=" cold";
    else if(i===secondMinP)cls+=" cool";
    return `<div class="digit ${cls}"><strong>${i}</strong><small>${p.toFixed(1)}%</small></div>`;
  }).join("");
}

function updateChartScale(){

}

function formatChartTime(ts){
  const d=new Date(ts);
  return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
}
function getChartPoints(){
  const now=Date.now();
  const points=[];
  const base=state.ticks.length?state.ticks[0].value:10000;
  for(let i=0;i<=180;i++){
    const ts=now-(180-i)*1000;
    const existing=state.ticks[Math.max(0,state.ticks.length-181+i)];
    let value=existing?.value;
    if(value==null){
      const wave=Math.sin(i*.22)*.45+Math.sin(i*.071)*.72+(Math.random()-.5)*.22;
      value=base+wave;
    }
    points.push({ts,value});
  }
  return points;
}
function renderChartFrame(){
  if(window.bindTradeHubChartZoom)window.bindTradeHubChartZoom();
  const canvas=document.getElementById("chartCanvas");
  const scroll=document.getElementById("chartScroll");
  if(!canvas||!scroll)return;
  const points=getChartPoints();
  const width=Math.max(scroll.clientWidth, points.length*9);
  canvas.style.width=width+"px";

  const oldSvg=canvas.querySelector(".chart-svg");
  if(oldSvg)oldSvg.remove();
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","chart-svg");
  svg.setAttribute("width",width);svg.setAttribute("height","100%");
  svg.setAttribute("viewBox",`0 0 ${width} 220`);
  svg.style.position="absolute";svg.style.inset="0";svg.style.pointerEvents="none";

  const vals=points.map(p=>p.value),center=95.08,spread=.36,min=center-spread,max=center+spread,range=Math.max(.00001,max-min);
  const W=width,H=220,left=8,right=76,top=12,bottom=24;
  const path=points.map((p,i)=>{
    const x=left+i*(W-left-right)/(points.length-1);
    const y=top+(max-p.value)/range*(H-top-bottom);
    return `${i?"L":"M"}${x.toFixed(2)} ${y.toFixed(2)}`;
  }).join(" ");
  const line=document.createElementNS("http://www.w3.org/2000/svg","path");
  line.setAttribute("d",path);line.setAttribute("fill","none");line.setAttribute("stroke","currentColor");line.setAttribute("stroke-width","2");line.setAttribute("color","#24d3a3");
  svg.appendChild(line);

  for(let i=0;i<5;i++){
    const y=top+i*(H-top-bottom)/4;
    const g=document.createElementNS("http://www.w3.org/2000/svg","line");
    g.setAttribute("x1",left);g.setAttribute("x2",W-right);g.setAttribute("y1",y);g.setAttribute("y2",y);g.setAttribute("stroke","rgba(115,132,154,.13)");g.setAttribute("stroke-width","1");
    svg.appendChild(g);
  }
  canvas.prepend(svg);

  const axisX=document.getElementById("chartAxisX"),axisY=document.getElementById("chartAxisY");
  if(axisX){
    axisX.innerHTML="";
    [0,45,90,135,180].forEach(i=>{
      const s=document.createElement("span");s.textContent=formatChartTime(points[i].ts);
      s.style.left=(left+i*(W-left-right)/(points.length-1))+"px";axisX.appendChild(s);
    });
  }
  if(axisY){
    axisY.querySelectorAll(".scale-digit").forEach(x=>x.remove());
    [0,1,2,3,4].forEach(i=>{
      const s=document.createElement("span");s.className="scale-digit";
      const v=max-(max-min)*i/4;s.textContent=v.toFixed(2);
      s.style.top=(top+i*(H-top-bottom)/4)+"px";axisY.appendChild(s);
    });
  }

  const last=points[points.length-1],y=top+(max-last.value)/range*(H-top-bottom);
  const live=document.getElementById("chartLiveValue");if(live){live.textContent=last.value.toFixed(3);live.style.top=y+"px"}
  const badge=document.getElementById("chartTimeBadge");if(badge)badge.textContent=formatChartTime(last.ts);
  scroll.scrollLeft=Math.max(0,canvas.scrollWidth-scroll.clientWidth);
}

function drawChart(){
  enableChartHistory();
  renderChartFrame();
  const svg=document.getElementById("chartSvg"), W=720,H=410;
  const vals=state.ticks.length?state.ticks.map(t=>t.value):[10000,10002,9998,10005];
  const min=Math.min(...vals)-5,max=Math.max(...vals)+5;
  let grid="";
  for(let x=0;x<=W;x+=72)grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#1b2737" stroke-width="1"/>`;
  for(let y=0;y<=H;y+=55)grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#1b2737" stroke-width="1"/>`;
  const pts=vals.map((v,i)=>`${(i/(Math.max(1,vals.length-1)))*W},${H-((v-min)/(max-min))*H}`).join(" ");
  const area=`0,${H} ${pts} ${W},${H}`;
  svg.innerHTML=`${grid}<polygon points="${area}" fill="rgba(180,190,205,.10)"/><polyline points="${pts}" fill="none" stroke="#d7dce5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
  const current=vals[vals.length-1]||0;
  document.getElementById("price").textContent=current.toFixed(2);
  const change=vals.length>10?((current-vals[0])/vals[0]*100):0;
  updateChartScale();

}

function digitStatsForTicks(ticks){
  const counts=Array(10).fill(0);
  ticks.forEach(t=>counts[t.digit]++);
  const total=Math.max(1,ticks.length);
  const pct=counts.map(c=>c/total*100);
  const even=pct[0]+pct[2]+pct[4]+pct[6]+pct[8];
  const odd=100-even;
  return {counts,pct,even,odd};
}

function scannerQuality(contract,ticks){
  const s=digitStatsForTicks(ticks);
  let label="Wait", edge=0, explanation="No strong distribution edge.";
  if(contract==="Even / Odd"){
    const evenEdge=Math.abs(s.even-50);
    if(evenEdge>=1){label=s.even>=50?"Even":"Odd";edge=evenEdge;explanation=`${label} distribution ${Math.max(s.even,s.odd).toFixed(1)}%`}
  }else if(contract==="Matches / Differs"){
    const ranked=s.pct.map((p,d)=>({d,p})).sort((a,b)=>a.p-b.p);
    const cold=ranked[0];
    label=`Differs ${cold.d}`;edge=Math.max(0,10-cold.p);explanation=`Digit ${cold.d} is the least frequent at ${cold.p.toFixed(1)}%`;
  }else{
    let best={d:4,p:50,dir:"Under"};
    for(let d=0;d<=9;d++){
      const under=s.pct.slice(0,d+1).reduce((a,b)=>a+b,0);
      const over=100-under;
      const candidate=Math.max(under,over);
      if(candidate>best.p){best={d,p:candidate,dir:under>=over?"Under":"Over"}}
    }
    label=`${best.dir} ${best.d}`;edge=Math.max(0,best.p-50);explanation=`${best.dir} ${best.d} distribution ${best.p.toFixed(1)}%`;
  }
  const quality=clamp(50+edge*5+(Math.random()*2-1),50,95);
  return {label,quality,explanation,stats:s};
}

function publicHistoryForScanner(symbols){
  return new Promise((resolve)=>{
    let ws;
    const results={};
    const reqMap={};
    let finished=false;
    const timer=setTimeout(()=>{if(!finished){finished=true;try{ws?.close()}catch{};resolve(results)}},8000);
    try{ws=new WebSocket(DERIV_PUBLIC_WS)}catch{clearTimeout(timer);resolve(results);return}
    ws.onopen=()=>symbols.forEach((symbol,i)=>{const req_id=700+i;reqMap[req_id]=symbol;ws.send(JSON.stringify({ticks_history:symbol,count:100,end:"latest",style:"ticks",subscribe:0,req_id}))});
    ws.onmessage=(ev)=>{
      try{
        const d=JSON.parse(ev.data);
        if(d.msg_type!=="history" || !d.history?.prices)return;
        const symbol=reqMap[d.req_id] || d.echo_req?.ticks_history;
        if(symbol)results[symbol]=d.history.prices.map(price=>({value:Number(price),digit:Number(String(price).replace(".","").replace(/0+$/," ").trim().slice(-1))%10})).filter(x=>Number.isFinite(x.value));
        if(Object.keys(results).length>=symbols.length){finished=true;clearTimeout(timer);try{ws.close()}catch{};resolve(results)}
      }catch{}
    };
    ws.onerror=()=>{if(!finished){finished=true;clearTimeout(timer);resolve(results)}};
  });
}

function openScanner(){
  const m=document.createElement("div");m.className="modal scanner-modal";
  m.innerHTML=`<div class="modal-card scanner-card">
    <div class="scanner-head"><div class="scanner-title"><div class="scanner-icon">✧</div><h3>Entry Scanner</h3></div><button class="close">×</button></div>
    <div class="scanner-body">
      <label class="scanner-label">Market</label>
      <select class="scanner-market" id="scanMarket"><option>Matches / Differs</option><option>Even / Odd</option><option>Over / Under</option></select>
      <div class="scanner-label best-label">Best Match</div>
      <div class="best-match"><b id="bestMarket">Waiting for scan…</b><small id="bestEntry">Choose a market and scan</small></div>
      <div class="scan-progress-row"><b>Scan complete</b><span id="scanCount">0/13</span></div>
      <div class="progress scanner-progress"><i id="scanProgress"></i></div>
      <div class="quality" id="scanQuality"><span>○</span><b>Ready to scan</b></div>
      <button class="scan scanner-rescan" id="scanGo">↻ &nbsp; Re-scan</button>
      <button class="load-market" id="loadMarket" disabled>Load selected volatility</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.querySelector(".close").onclick=()=>m.remove();
  const symbols=Object.values(DERIV_SYMBOLS);
  const names=Object.keys(DERIV_SYMBOLS);
  let best=null,scanRunning=false;
  const contractName=()=>m.querySelector("#scanMarket").value;
  const runScan=async()=>{
    if(scanRunning)return;
    scanRunning=true;best=null;
    const bar=m.querySelector("#scanProgress"),count=m.querySelector("#scanCount"),q=m.querySelector("#scanQuality"),go=m.querySelector("#scanGo"),load=m.querySelector("#loadMarket");
    go.disabled=true;load.disabled=true;bar.style.width="0%";count.textContent="0/13";q.innerHTML='<span class="scan-spinner">◌</span><b>Scanning markets…</b>';
    const data=await publicHistoryForScanner(symbols);
    for(let i=0;i<symbols.length;i++){
      const symbol=symbols[i],ticks=data[symbol]||[];
      let result;
      if(ticks.length) result=scannerQuality(contractName(),ticks);
      else result={label:"No data",quality:0,explanation:"Market data unavailable"};
      const candidate={symbol,name:names[i],...result};
      if(!best || candidate.quality>best.quality)best=candidate;
      const pct=Math.round(((i+1)/symbols.length)*100);
      bar.style.width=pct+"%";count.textContent=(i+1)+"/13";
      await new Promise(r=>setTimeout(r,70));
    }
    if(best && best.quality>0){
      m.querySelector("#bestMarket").textContent=best.name;
      m.querySelector("#bestEntry").innerHTML=`${esc(contractName())} · <strong>${esc(best.label)}</strong>`;
      q.innerHTML=`<span class="quality-check">✓</span><b>Quality ${best.quality.toFixed(2)}%</b><span> · best entry found</span>`;
      load.disabled=false;load.textContent=`Load ${best.name}`;
      load.onclick=()=>{const idx=VOLATILITY_CATALOG.findIndex(v=>v.name===best.name);if(idx>=0){state.volatilityIndex=idx;startDerivPublicStream();m.remove();renderApp()}};
    }else{
      m.querySelector("#bestMarket").textContent="No market data available";
      m.querySelector("#bestEntry").textContent="Try Re-scan in a moment";
      q.innerHTML='<span>!</span><b>Scan could not complete</b>';
    }
    go.disabled=false;go.textContent="↻  Re-scan";scanRunning=false;
  };
  m.querySelector("#scanMarket").onchange=runScan;
  m.querySelector("#scanGo").onclick=runScan;
  runScan();
}

const DERIV_PUBLIC_WS="wss://api.derivws.com/trading/v1/options/ws/public";
const DERIV_SYMBOLS={
  "Volatility 10 (1s) Index":"1HZ10V",
  "Volatility 10 Index":"R_10",
  "Volatility 15 (1s) Index":"1HZ15V",
  "Volatility 25 (1s) Index":"1HZ25V",
  "Volatility 25 Index":"R_25",
  "Volatility 30 (1s) Index":"1HZ30V",
  "Volatility 50 (1s) Index":"1HZ50V",
  "Volatility 50 Index":"R_50",
  "Volatility 75 (1s) Index":"1HZ75V",
  "Volatility 75 Index":"R_75",
  "Volatility 90 (1s) Index":"1HZ90V",
  "Volatility 100 (1s) Index":"1HZ100V",
  "Volatility 100 Index":"R_100"
};
let derivWs=null;
let derivReconnect=null;

function selectedDerivSymbol(){
  const v=VOLATILITY_CATALOG[state.volatilityIndex];
  return DERIV_SYMBOLS[v?.name]||"1HZ10V";
}

function startDerivPublicStream(){
  if(derivWs){try{derivWs.close()}catch{}}
  const symbol=selectedDerivSymbol();
  derivWs=new WebSocket(DERIV_PUBLIC_WS);
  derivWs.onopen=()=>{
    derivWs.send(JSON.stringify({ticks_history:symbol,count:200,end:"latest",style:"ticks",subscribe:1,req_id:101}));
  };
  derivWs.onmessage=(ev)=>{
    try{
      const data=JSON.parse(ev.data);
      if(data.msg_type==="history" && Array.isArray(data.history?.prices)){
        const times=data.history.times||[];
        data.history.prices.forEach((price,i)=>{
          const value=Number(price);
          if(!Number.isFinite(value))return;
          const digit=Number(String(value).replace(".","").replace(/0+$/,"").slice(-1))%10;
          state.ticks.push({value,digit,epoch:times[i]});
        });
        state.ticks=state.ticks.slice(-1000);
        if(state.ticks.length)state.lastDigit=state.ticks[state.ticks.length-1].digit;
        updateLiveUI();
      }
      if(data.msg_type==="tick" && data.tick){
        const value=Number(data.tick.quote);
        if(!Number.isFinite(value))return;
        const text=String(data.tick.quote);
        const digit=Number(text.replace(".","").replace(/0+$/,"").slice(-1))%10;
        state.ticks.push({value,digit,epoch:data.tick.epoch});
        if(state.ticks.length>1000)state.ticks.shift();
        state.lastDigit=digit;
        if(state.running)settleTick(digit); else updateLiveUI();
      }
    }catch{}
  };
  derivWs.onclose=()=>{
    clearTimeout(derivReconnect);
    derivReconnect=setTimeout(startDerivPublicStream,2500);
  };
  derivWs.onerror=()=>{};
}


// Restore a saved session locally. No Supabase JavaScript SDK is required.
const savedAuth=getSavedSession();
state.session=savedAuth.session;
state.user=savedAuth.user;
if(state.user && state.session){
  loadUserData().then(()=>renderApp()).catch(()=>renderApp());

  renderAuth();
}
state.ticks=[];
for(let i=0;i<65;i++){const prev=state.ticks.length?state.ticks[state.ticks.length-1].value:10000;const value=+(prev+(Math.random()-.5)*8).toFixed(2);state.ticks.push({value,digit:Math.floor(Math.abs(Math.round(value*100)))%10})}
state.lastDigit=state.ticks[state.ticks.length-1].digit;
setInterval(()=>{if(!derivWs || derivWs.readyState!==WebSocket.OPEN) tick()},1000);
setInterval(saveUserData,5000);
setTimeout(startDerivPublicStream,250);
</script>
