<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Platform Interface Dashboard</title>
    <style>
        :root {
            --bg-deep: #06090e;
            --bg-surface: #0f141c;
            --bg-panel: #161f2b;
            --bg-input: #1e293b;
            --border-muted: #243242;
            
            --text-bright: #ffffff;
            --text-normal: #cbd5e1;
            --text-muted: #64748b;
            
            --brand-green: #00c853;
            --brand-red: #ff3d00;
            --brand-gold: #ffb300;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-normal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Top Header Control Bar */
        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-muted);
            min-height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 10;
            width: 100%;
        }

        .brand-zone {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--brand-gold), var(--brand-green));
            border-radius: 6px;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: 0.5px;
        }

        .user-meta-zone {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .balance-pill {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-muted);
            border-radius: 20px;
            padding: 6px 14px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .balance-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .balance-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--brand-gold);
        }

        /* Responsive Layout Matrix */
        .workspace {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
        }

        /* Desktop View Override Rules */
        @media (min-width: 992px) {
            .workspace {
                display: grid;
                grid-template-columns: 1fr 340px;
                height: calc(100vh - 60px);
                overflow: hidden;
            }
        }

        .chart-workspace-container {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-deep);
            position: relative;
            flex: 1;
            min-height: 450px;
        }

        /* Asset Selector Navigation Strip */
        .asset-bar {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-muted);
            height: 45px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 5px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .asset-bar::-webkit-scrollbar {
            display: none;
        }

        .asset-tab {
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-block;
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            transition: all 0.2s;
        }

        .asset-tab.active {
            background-color: var(--bg-panel);
            color: var(--text-bright);
            border: 1px solid var(--border-muted);
        }

        /* Fixed Viewport Window Area */
        .viewport-frame {
            height: 300px;
            position: relative;
            padding: 20px;
            flex: 1;
            min-height: 250px;
        }

        .ticker-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            background-color: rgba(15, 20, 28, 0.85);
            border: 1px solid var(--border-muted);
            padding: 8px 12px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }

        .ticker-pair {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .ticker-live-price {
            font-size: 20px;
            font-weight: 700;
            margin-top: 2px;
            font-family: monospace;
        }

        .ticker-live-price.up { color: var(--brand-green); }
        .ticker-live-price.down { color: var(--brand-red); }

        .svg-chart-layer {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Order Panel Management Station */
        .order-station {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-muted);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
        }

        @media (min-width: 992px) {
            .order-station {
                border-top: none;
                border-left: 1px solid var(--border-muted);
                overflow-y: auto;
            }
        }

        .panel-heading {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-bright);
        }

        .control-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-block label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .field-frame {
            background-color: var(--bg-input);
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }

        .field-frame input, .field-frame select {
            width: 100%;
            height: 40px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-bright);
            font-size: 15px;
            font-weight: 600;
        }

        .yield-matrix-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .matrix-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .matrix-value-payout {
            color: var(--brand-green);
            font-weight: 700;
        }

        .matrix-value-return {
            color: var(--text-bright);
            font-weight: 700;
            font-size: 15px;
        }

        /* Action Buttons Area */
        .execution-block {
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }

        .btn-execution {
            flex: 1;
            border: none;
            height: 50px;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: opacity 0.15s ease;
        }

        .btn-execution:hover { opacity: 0.9; }
        .btn-execution:active { opacity: 0.8; }

        .btn-higher { background-color: var(--brand-green); }
        .btn-lower { background-color: var(--brand-red); }

        /* Bottom History Console */
        .history-console {
            min-height: 150px;
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-muted);
            display: flex;
            flex-direction: column;
        }

        .console-tab-strip {
            background-color: var(--bg-deep);
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-muted);
        }

        .console-tab {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-bright);
        }

        .console-feed-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
            max-height: 200px;
        }

        .log-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(36, 50, 66, 0.3);
            font-size: 12px;
        }

        .log-dir-up { color: var(--brand-green); font-weight: 600; }
        .log-dir-down { color: var(--brand-red); font-weight: 600; }
