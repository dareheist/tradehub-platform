<script>
window.TRADEHUB_MARKETS = [
  {name:"Volatility 10", short:"V10", step:.0008, noise:.35, drift:.02, digits:.10},
  {name:"Volatility 25", short:"V25", step:.0012, noise:.55, drift:.01, digits:.25},
  {name:"Volatility 50", short:"V50", step:.0018, noise:.75, drift:.00, digits:.50},
  {name:"Volatility 75", short:"V75", step:.0025, noise:.95, drift:-.01, digits:.75},
  {name:"Volatility 100", short:"V100", step:.0032, noise:1.15, drift:.00, digits:1.00}
];
window.THMarket = {index:2, price:1000, history:[]};

function thMarket(){
  return window.TRADEHUB_MARKETS[window.THMarket.index];
}
function thTick(){
  const m=thMarket();
  const h=window.THMarket.history;
  const prev=window.THMarket.price;
  const momentum=h.length ? (h[h.length-1].price-(h[Math.max(0,h.length-8)]?.price||prev))/Math.max(1,Math.min(8,h.length)) : 0;
  const shock=(Math.random()-.5)*m.noise;
  const mean=(1000-prev)*0.00015;
  const delta=(m.step*(shock + momentum*100 + m.drift + mean*10));
  const price=Math.max(.01,prev+delta);
  const digit=Math.abs(Math.floor(price*100))%10;
  window.THMarket.price=price;
  h.push({time:Date.now(),price,digit});
  if(h.length>180) h.shift();
  return {price,digit};
}
function thDigitPercentages(){
  const counts=Array(10).fill(0);
  for(const x of window.THMarket.history) counts[x.digit]++;
  const total=Math.max(1,window.THMarket.history.length);
  return counts.map(n=>n/total*100);
}
function thSelectMarket(i){
  window.THMarket.index=Math.max(0,Math.min(window.TRADEHUB_MARKETS.length-1,Number(i)||0));
  window.THMarket.history=[];
  window.THMarket.price=1000;
  const m=thMarket();
  for(let i=0;i<40;i++) thTick();
  document.dispatchEvent(new CustomEvent("tradehub-market-change",{detail:m}));
}
</script>

    const p=typeof thDigitPercentages==="function"?thDigitPercentages():Array(10).fill(10);
    [...box.children].forEach((el,i)=>{
      el.querySelector("small").textContent=(p[i]||0).toFixed(1)+"%";
      el.classList.toggle("th-current",i===markerDigit);
      const old=el.querySelector(".th-marker");
      if(old) old.remove();
      if(i===markerDigit){
        const m=document.createElement("span");m.className="th-marker";el.appendChild(m);
      }
    });
  }

  function startMarker(){
    clearInterval(markerTimer);
    markerTimer=setInterval(()=>{
      const h=window.THMarket?.history||[];
      const recent=h.slice(-12);
      if(recent.length){
        // Systematic/random movement weighted toward digits recently produced by the market.
        const weights=Array(10).fill(0.35);
        recent.forEach((x,j)=>weights[x.digit]+=1+(j/recent.length));
        let r=Math.random()*weights.reduce((a,b)=>a+b,0), pick=0;
        for(let i=0;i<10;i++){r-=weights[i];if(r<=0){pick=i;break}}
        markerDigit=pick;
      }else markerDigit=Math.floor(Math.random()*10);
      refreshMatrix();
    },180);
  }

  function sound(win){
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      const now=audioCtx.currentTime;
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="square";
      // Original short notification tones; not copied from PAL Option.
      o.frequency.setValueAtTime(win?880:180,now);
      o.frequency.exponentialRampToValueAtTime(win?1320:95,now+.16);
      g.gain.setValueAtTime(.0001,now);
      g.gain.exponentialRampToValueAtTime(.055,now+.012);
      g.gain.exponentialRampToValueAtTime(.0001,now+.25);
      o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+.27);
    }catch(e){}
  }

  function showSettlement(contract,digit,win){
    ensureMatrix();
    const box=document.getElementById("thDigitMatrix");
    if(box){
      [...box.children].forEach((el,i)=>{
        el.classList.remove("th-win","th-loss");
        if(i===digit) el.classList.add(win?"th-win":"th-loss");
      });
    }
    const s=document.getElementById("thSettlement");
    if(s) s.textContent=`${contract || "Trade"} • Digit ${digit} • ${win?"WIN":"LOSS"}`;
    sound(win);
  }

  // Public hook for the existing trade engine. It only displays a result;
  // it does not choose or manipulate a user's outcome.
  window.TradeHubSettleDigit=function(contract,digit,win){
    markerDigit=Number(digit)||0;
    refreshMatrix();
    showSettlement(contract,markerDigit,!!win);
  };

  ensureMatrix();
  startMarker();
  setInterval(refreshMatrix,700);

  // Keep the market display synchronized with the existing tick engine.
  document.addEventListener("tradehub-market-change",()=>{
    markerDigit=0;
    ensureMatrix();
    refreshMatrix();
  });
})();
</script>

</body></html>
