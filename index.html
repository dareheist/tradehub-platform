<html lang="en">
<head>

<style>

#app{position:relative;z-index:1}.topbar{height:76px;background:#10171f;border-bottom:1px solid #202a34;display:flex;align-items:center;padding:0 16px;gap:14px;position:sticky;top:0;z-index:30}
.menu-btn{width:44px;height:44px;background:transparent;border:0;color:#8f9aa6;font-size:29px}.top-brand{display:flex;align-items:center;gap:10px;min-width:150px}.mini-mark{width:38px;height:38px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:#042014;font-weight:1000}.top-name{font-size:22px;font-weight:950}.top-name span{color:var(--green)}
.account-pill{margin-left:auto;background:#18212b;border:1px solid #2b3540;border-radius:30px;padding:7px 12px;display:flex;align-items:center;gap:10px;min-width:150px;justify-content:center}.mode-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#093d34;color:var(--green);font-weight:900}.balance-text{font-weight:900}.caret{color:#66727f}.deposit{padding:12px 22px;border-radius:28px;background:linear-gradient(135deg,#00d084,#0bb98b);color:#03140d;font-weight:950;border:0}.bell{background:transparent;border:0;color:#8b96a1;font-size:25px}
.contract-nav{height:68px;background:#0c131a;border-bottom:1px solid #1c2630;display:flex;justify-content:center;gap:12px;padding:10px 14px;position:sticky;top:76px;z-index:20}.contract-nav button{border:0;background:transparent;color:#667380;font-weight:800;padding:0 24px;border-radius:30px}.contract-nav button.active{background:#1b232d;color:#f1f4f7;box-shadow:inset 0 0 0 1px #2c3743}.contract-nav button.active .ico{color:var(--green)}
.main{max-width:1400px;margin:auto}.market{position:relative;background:#0b1219;border-bottom:1px solid #202b35}.chart-head{position:absolute;left:16px;top:16px;z-index:4;background:rgba(17,25,34,.94);border:1px solid #28333f;border-radius:18px;padding:10px 16px;min-width:205px}.chart-title{font-weight:900}.chart-sub{color:#8995a1;font-size:14px}.chart-sub b{color:var(--red)}.chart-box{height:460px;position:relative;overflow:hidden}.chart-grid{position:absolute;inset:0;background:linear-gradient(rgba(56,71,84,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(56,71,84,.18) 1px,transparent 1px);background-size:68px 68px}.chart-box canvas{position:absolute;inset:0;width:100%;height:100%}.zoom{position:absolute;left:16px;bottom:18px;z-index:4;display:grid;gap:7px}.zoom button{width:62px;height:62px;border-radius:16px;background:#172230;border:1px solid #2a3846;color:#aab4bf;font-size:31px}.price-badge{position:absolute;right:12px;top:20px;background:#1b2533;border:1px solid #334154;border-radius:8px;padding:12px 14px;color:#9da8b4;font-size:17px}
.digits{display:grid;grid-template-columns:repeat(10,1fr);gap:9px;padding:14px;background:#101821;border-bottom:1px solid #202a34}.digit{position:relative;text-align:center;border:1px solid #202c3a;background:#111b27;border-radius:50%;width:62px;height:62px;justify-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.digit strong{font-size:18px}.digit small{font-size:10px;color:#66727e}.digit:before{content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid transparent;border-top-color:#273548}.digit.hot:before{border-top-color:var(--green)}.digit.loss:before{border-top-color:var(--red)}
.controls{background:#0d141c}.auto-row{display:grid;grid-template-columns:1fr 1fr}.auto-row button{height:70px;border:0;border-right:1px solid #26313b;background:#0d151d;color:#626e7b;font-weight:900;font-size:17px}.auto-row button.active{color:var(--green);background:rgba(0,208,132,.08)}
.trade-controls{display:grid;grid-template-columns:1.1fr 1fr 1.35fr;min-height:95px;border-bottom:1px solid #202a34}.stake-control{display:grid;grid-template-columns:56px 1fr 56px;border-right:1px solid #202a34;align-items:center}.stake-control button{height:100%;background:transparent;border:0;color:#76828f;font-size:30px}.stake-value{text-align:center}.stake-label{font-size:11px;color:#8c97a2;font-weight:900;letter-spacing:1px}.stake-number{font-size:30px;font-weight:950}.ai{background:linear-gradient(135deg,#221c4b,#251c52);display:flex;align-items:center;justify-content:center;gap:14px;border-right:1px solid #202a34}.ai-icon{font-size:26px;color:#a99cff}.ai strong{color:#aaa1ff;font-size:20px}.ai small{display:block;color:#5e5a7d}.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #202a34}.risk{padding:15px;text-align:center;border-right:1px solid #202a34}.risk:last-child{border:0}.risk-label{font-size:12px;font-weight:900;letter-spacing:.7px}.risk-value{font-size:23px;font-weight:950;margin-top:5px}.profit .risk-label{color:var(--green)}.stop .risk-label{color:#ff5578}.multi .risk-label{color:#ffc400}.session{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #202a34}.session-left{color:#6f7b87}.session-left span{margin-left:12px}.session-pl{font-size:22px;font-weight:950;color:#ff5578}.execute{display:grid;grid-template-columns:1fr 1fr}.execute button{height:92px;border:0;color:white;font-size:28px;font-weight:950}.even{background:#00c879}.odd{background:#ff285d}.execute small{display:block;font-size:14px;opacity:.65;margin-top:2px;font-weight:700}
.bottom-nav{height:82px;background:#111820;border-top:1px solid #25303a;display:grid;grid-template-columns:1fr 1fr;position:sticky;bottom:0;z-index:20}.bottom-nav button{background:transparent;border:0;color:#5d6976;font-weight:900;font-size:17px}.bottom-nav button.active{color:var(--green)}.bottom-nav .nav-icon{font-size:26px;display:block}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50}.drawer{position:absolute;left:0;top:0;bottom:0;width:min(430px,88vw);background:#0b1118;overflow:auto;border-right:1px solid #26313b}.drawer-head{padding:20px 28px 18px;border-bottom:1px solid #202a34}.drawer-item{height:70px;padding:0 28px;display:flex;align-items:center;gap:22px;color:#b8c1ca;font-size:18px;border-bottom:1px solid rgba(32,42,52,.5);background:transparent;width:100%;text-align:left}.drawer-item:hover{background:#121a23}.drawer-item.highlight{background:linear-gradient(90deg,#211b46,#181531);color:#b69cff}.drawer-item.logout{color:#ff5878}.drawer-icon{width:26px;text-align:center;color:#82909d}.drawer-footer{padding:20px 28px;color:#596674;font-size:13px}.switch{margin-left:auto;width:58px;height:32px;border-radius:20px;background:#24313e;padding:3px}.switch i{display:block;width:26px;height:26px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(26px)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:70;display:grid;place-items:center;padding:18px}.modal{width:min(460px,100%);background:#111a23;border:1px solid #293541;border-radius:22px;padding:22px}.modal h3{margin:0;font-size:22px}.modal p{color:#8995a1;line-height:1.5}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:100;background:#18232d;border:1px solid #30404d;padding:12px 16px;border-radius:12px;color:#e7edf2;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:92vw;text-align:center}
@media(min-width:900px){.market,.digits,.controls,.bottom-nav{border-left:1px solid #202a34;border-right:1px solid #202a34}.chart-box{height:520px}.main{padding:0 16px}.bottom-nav{position:relative}}
@media(max-width:700px){.topbar{height:auto;min-height:76px;flex-wrap:wrap;padding:10px 12px}.top-brand{min-width:0;flex:1}.top-name{font-size:20px}.account-pill{order:3;width:100%;margin:0;min-width:0}.deposit{padding:11px 15px}.bell{font-size:22px}.contract-nav{top:0;position:relative;height:62px;overflow-x:auto;justify-content:flex-start}.contract-nav button{white-space:nowrap;padding:0 15px}.chart-box{height:410px}.digits{gap:4px;padding:10px 5px}.digit{width:47px;height:47px}.digit strong{font-size:15px}.digit small{font-size:8px}.trade-controls{grid-template-columns:1fr 1.1fr}.ai{grid-column:1/-1;min-height:74px;border-top:1px solid #202a34}.risk-grid{grid-template-columns:1fr 1fr 1fr}.risk{padding:12px 4px}.risk-value{font-size:19px}.session{padding:0 14px}.session-pl{font-size:19px}.execute button{height:84px;font-size:24px}.auth-title{font-size:37px}.auth-card{margin-top:38px}.brand-name{font-size:25px}}
@media(max-width:430px){.chart-box{height:350px}.price-badge{font-size:14px}.chart-head{min-width:180px}.stake-number{font-size:25px}.stake-control{grid-template-columns:44px 1fr 44px}.drawer-item{padding:0 22px}.drawer-head{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>

<!-- AUTH -->
<section id="authScreen" class="screen auth-bg">
  <div class="auth-wrap">
    <div class="brand">
      <div class="brand-mark">↗</div>
      <div class="brand-name">Trade<span>Hub</span></div>
      <button id="themeBtn" title="Toggle theme" style="margin-left:auto;border:0;background:transparent;color:#6e7b88;font-size:22px">☼</button>
    </div>

    <div class="auth-card">
      <h1 id="authTitle" class="auth-title">Welcome back</h1>
      <p id="authSubtitle" class="auth-sub">Sign in to your account to continue trading</p>

      <form id="authForm">
        <div style="margin-bottom:18px">
          <label class="auth-label">Email</label>
          <div class="input-wrap">
            <span class="icon">✉</span>
            <input id="email" class="field" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div style="margin-bottom:8px">
          <label class="auth-label">Password</label>
          <div class="input-wrap">
            <span class="icon">▣</span>
            <input id="password" class="field" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="6" required>
            <button id="eyeBtn" class="eye" type="button">◉</button>
          </div>
        </div>

        <div class="auth-row">
          <label class="check"><input id="remember" type="checkbox" checked> Remember me</label>
          <button id="forgotBtn" type="button" class="link" style="border:0;background:transparent">Forgot password?</button>
        </div>

        <button id="authBtn" class="btn-green glow" type="submit" style="width:100%;padding:16px">Sign In&nbsp; →</button>
        <div id="authMessage" class="message"></div>
      </form>

      <div class="auth-switch">
        <span id="switchText">Don't have an account?</span>
        <button id="switchBtn" type="button">Create account</button>
      </div>
    </div>
  </div>
</section>

<!-- APP -->
<section id="app" class="hidden">
  <header class="topbar">
    <button id="menuBtn" class="menu-btn" aria-label="Menu">☰</button>
    <div class="top-brand">
      <div class="mini-mark">T</div>
      <div class="top-name">Trade<span>Hub</span></div>
    </div>

    <button id="accountPill" class="account-pill" type="button">
      <span id="modeDot" class="mode-dot">D</span>
      <span id="modeBalance" class="balance-text">$10,000.00</span>
      <span class="caret">⌄</span>
    </button>

    <button id="depositBtn" class="deposit" type="button">Deposit</button>
    <button id="bellBtn" class="bell" type="button">♧</button>
  </header>

  <nav class="contract-nav">
    <button data-contract="matches">◎ &nbsp;Matches/Differs</button>
    <button data-contract="evenodd" class="active"><span class="ico">▦</span> &nbsp;Even/Odd</button>
    <button data-contract="overunder">⇅ &nbsp;Over/Under</button>
  </nav>

  <main class="main">
    <section class="market">
      <div class="chart-head">
        <div class="chart-title">Vol 10 (1s) <span style="color:#596674">⌄</span></div>
        <div class="chart-sub"><span id="price">9440.88</span> <b id="change">-0.62%</b></div>
      </div>
      <div class="price-badge"><span id="priceBadge">100%</span></div>
      <div class="chart-box">
        <div class="chart-grid"></div>
        <canvas id="chart"></canvas>
        <div class="zoom">
          <button id="zoomIn" type="button">+</button>
          <button id="zoomOut" type="button">−</button>
        </div>
      </div>
    </section>

    <section id="digits" class="digits"></section>

    <section class="controls">
      <div class="auto-row">
        <button id="autoBtn" class="active" type="button">● &nbsp;AUTO</button>
        <button id="manualBtn" type="button">● &nbsp;MANUAL</button>
      </div>

      <div class="trade-controls">
        <div class="stake-control">
          <button id="stakeMinus" type="button">−</button>
          <div class="stake-value">
            <div class="stake-label">STAKE</div>
            <div class="stake-number" id="stakeNumber">10</div>
          </div>
          <button id="stakePlus" type="button">+</button>
        </div>
        <button id="scannerBtn" class="ai" type="button">
          <span class="ai-icon">✧</span>
          <span><strong>AI Scanner</strong><small>Find market statistics</small></span>
        </button>
        <div class="ai" style="display:none"></div>
      </div>

      <div class="risk-grid">
        <div class="risk profit"><div class="risk-label">TAKE PROFIT</div><div class="risk-value">$<span id="takeProfit">200</span></div></div>
        <div class="risk stop"><div class="risk-label">STOP LOSS</div><div class="risk-value">$<span id="stopLoss">999</span></div></div>
        <div class="risk multi"><div class="risk-label">MULTIPLIER</div><div class="risk-value">× <span id="multiplier">2</span></div></div>
      </div>

      <div class="session">
        <div class="session-left">● &nbsp;Session <span id="sessionStats">18t · 6W/12L</span></div>
        <div id="sessionPL" class="session-pl">-$577.17</div>
      </div>

      <div id="execute" class="execute">
        <button id="evenBtn" class="even" type="button">Even<small>$19.52</small></button>
        <button id="oddBtn" class="odd" type="button">Odd<small>$19.52</small></button>
      </div>
    </section>

    <nav class="bottom-nav">
      <button id="tradeTab" class="active" type="button"><span class="nav-icon">▥</span>Trade</button>
      <button id="positionsTab" type="button"><span class="nav-icon">◷</span>Positions</button>
    </nav>
  </main>
</section>

<!-- DRAWER -->
<div id="drawerBackdrop" class="drawer-backdrop hidden">
  <aside class="drawer">
    <div class="drawer-head">
      <div class="brand"><div class="mini-mark">T</div><div class="top-name">Trade<span>Hub</span></div></div>
      <div style="color:#6e7b88;margin-top:12px;font-size:13px" id="drawerEmail"></div>
    </div>
    <button class="drawer-item" data-drawer="settings"><span class="drawer-icon">⚙</span>Account settings<span style="margin-left:auto">⌄</span></button>
    <button id="drawerDeposit" class="drawer-item"><span class="drawer-icon">⇩</span>Deposit<span style="margin-left:auto">›</span></button>
    <button id="drawerWithdraw" class="drawer-item"><span class="drawer-icon">⇧</span>Withdraw<span style="margin-left:auto">›</span></button>
    <button id="drawerHistory" class="drawer-item"><span class="drawer-icon">◷</span>History<span style="margin-left:auto">›</span></button>
    <button class="drawer-item highlight" id="referBtn"><span class="drawer-icon">♧</span>Refer & Earn</button>
    <button id="themeDrawer" class="drawer-item"><span class="drawer-icon">☾</span>Dark theme <span id="themeSwitch" class="switch on"><i></i></span></button>
    <button id="helpBtn" class="drawer-item"><span class="drawer-icon">?</span>Help Centre</button>
    <button id="responsibleBtn" class="drawer-item"><span class="drawer-icon">♢</span>Responsible Trading<span style="margin-left:auto">›</span></button>
    <button id="chatBtn" class="drawer-item"><span class="drawer-icon">▢</span>Live Chat</button>
    <button id="drawerLogout" class="drawer-item logout"><span class="drawer-icon">↪</span>Log out</button>
    <div class="drawer-footer">TradeHub terminal • <span id="drawerTime"></span> • <span style="color:var(--green)">●</span></div>
  </aside>
</div>

<!-- MODAL -->
<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button id="modalClose" class="btn-dark" style="padding:11px 16px" type="button">Close</button>
      <button id="modalPrimary" class="btn-green" style="padding:11px 16px" type="button">Done</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";

/* Supabase configuration from the existing TradeHub project. */
const SUPABASE_URL = "https://xtozqmsknvevqvpiixjh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoieHRvemtxbXNrbnZldnF2cGlpeGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTUwMTQsImV4cCI6MjEwMjEzMTAxNH0.as8O-4i5m_PkTNlv77hawxt1-JuiYcjJu46B405q5u0";

const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const fmt = n => "$" + Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

const state = {
  mode:"demo",
  demoBalance:Number(localStorage.getItem("tradehub_demo_balance") || 10000),
  realBalance:Number(localStorage.getItem("tradehub_real_balance") || 0),
  user:null,
  authMode:"login",
  contract:"evenodd",
  side:"even",
  digit:3,
  stake:Number(localStorage.getItem("tradehub_stake") || 10),
  duration:5,
  multiplier:2,
  auto:true,
  price:9440.88,
  points:[],
  digitCounts:Array(10).fill(0),
  open:[],
  history:[],
  session:{trades:0,wins:0,losses:0,pl:0},
  zoom:1
};

function saveBalances(){
  localStorage.setItem("tradehub_demo_balance",String(state.demoBalance));
  localStorage.setItem("tradehub_real_balance",String(state.realBalance));
}
function activeBalance(){return state.mode==="demo"?state.demoBalance:state.realBalance}
function setActiveBalance(v){
  if(state.mode==="demo") state.demoBalance=v; else state.realBalance=v;
  saveBalances(); renderBalance();
}
function renderBalance(){
  $("modeDot").textContent=state.mode==="demo"?"D":"R";
  $("modeBalance").textContent=fmt(activeBalance());
}
function toast(msg){
  $("toast").textContent=msg;$("toast").classList.remove("hidden");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.add("hidden"),3000);
}
function openModal(title,text,body="",primary=()=>{}){
  $("modalTitle").textContent=title;$("modalText").textContent=text;$("modalBody").innerHTML=body;
  $("modalBackdrop").classList.remove("hidden");
  $("modalPrimary").onclick=primary;
}
function closeModal(){$("modalBackdrop").classList.add("hidden")}
$("modalClose").onclick=closeModal;
$("modalBackdrop").addEventListener("click",e=>{if(e.target===$("modalBackdrop"))closeModal()});

function setAuthMode(mode){
  state.authMode=mode;
  const login=mode==="login";
  $("authTitle").textContent=login?"Welcome back":"Create your account";
  $("authSubtitle").textContent=login?"Sign in to your account to continue trading":"Create your TradeHub account to start with demo trading";
  $("authBtn").textContent=login?"Sign In  →":"Create Account  →";
  $("switchText").textContent=login?"Don't have an account?":"Already have an account?";
  $("switchBtn").textContent=login?"Create account":"Sign in";
  $("password").autocomplete=login?"current-password":"new-password";
  $("authMessage").textContent="";
}
$("switchBtn").onclick=()=>setAuthMode(state.authMode==="login"?"signup":"login");
$("eyeBtn").onclick=()=>{$("password").type=$("password").type==="password"?"text":"password"};

$("forgotBtn").onclick=async()=>{
  const email=$("email").value.trim();
  if(!email){$("authMessage").textContent="Enter your email first.";return}
  if(!sb){$("authMessage").textContent="Authentication service is unavailable.";return}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  $("authMessage").textContent=error?error.message:"Password reset instructions have been sent if the address is registered.";
};

$("authForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!sb){$("authMessage").textContent="Supabase could not be initialized.";return}
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||!password){$("authMessage").textContent="Enter your email and password.";return}
  $("authBtn").disabled=true;$("authMessage").style.color="#84909d";$("authMessage").textContent="Signing in…";
  try{
    let result;
    if(state.authMode==="login") result=await sb.auth.signInWithPassword({email,password});
    else result=await sb.auth.signUp({email,password});
    if(result.error) throw result.error;
    if(state.authMode==="signup"&&!result.data.session){
      $("authMessage").textContent="Account created. Check your email if confirmation is enabled.";
    }else if(result.data.user){
      await enterApp(result.data.user);
    }
  }catch(err){
    $("authMessage").style.color="#ff7b96";$("authMessage").textContent=err.message||"Authentication failed.";
  }finally{$("authBtn").disabled=false}
});

async function enterApp(user){
  state.user=user;
  $("authScreen").classList.add("hidden");$("app").classList.remove("hidden");
  $("drawerEmail").textContent=user.email||"";
  renderBalance();renderStake();renderContract();
  if(!state.points.length) for(let i=0;i<30;i++)tick();
}
async function logout(){
  if(sb) await sb.auth.signOut();
  state.user=null;$("app").classList.add("hidden");$("authScreen").classList.remove("hidden");
  $("email").value="";$("password").value="";setAuthMode("login");
}

function renderStake(){
  $("stakeNumber").textContent=state.stake.toFixed(state.stake%1?2:0);
  localStorage.setItem("tradehub_stake",String(state.stake));
  $("evenBtn").innerHTML=`Even<small>${fmt(state.stake*1.952)}</small>`;
  $("oddBtn").innerHTML=`Odd<small>${fmt(state.stake*1.952)}</small>`;
}
$("stakeMinus").onclick=()=>{state.stake=Math.max(.35,Math.round((state.stake-.5)*100)/100);renderStake()};
$("stakePlus").onclick=()=>{state.stake=Math.round((state.stake+.5)*100)/100;renderStake()};

function renderContract(){
  document.querySelectorAll(".contract-nav button").forEach(b=>b.classList.toggle("active",b.dataset.contract===state.contract));
  if(state.contract==="evenodd"){
    $("evenBtn").textContent="Even";$("oddBtn").textContent="Odd";
  }else if(state.contract==="overunder"){
    $("evenBtn").textContent="Over";$("oddBtn").textContent="Under";
  }else{
    $("evenBtn").textContent="Matches";$("oddBtn").textContent="Differs";
  }
  renderStake();
}
document.querySelectorAll(".contract-nav button").forEach(b=>b.onclick=()=>{
  state.contract=b.dataset.contract;
  state.side=state.contract==="evenodd"?"even":state.contract==="overunder"?"over":"matches";
  renderContract();
});

function resizeCanvas(){
  const c=$("chart"),box=c.parentElement,r=window.devicePixelRatio||1;
  c.width=box.clientWidth*r;c.height=box.clientHeight*r;
  c.style.width=box.clientWidth+"px";c.style.height=box.clientHeight+"px";
  drawChart();
}
function drawChart(){
  const c=$("chart"),ctx=c.getContext("2d"),w=c.clientWidth,h=c.clientHeight;
  ctx.setTransform(window.devicePixelRatio||1,0,0,window.devicePixelRatio||1,0,0);
  ctx.clearRect(0,0,w,h);
  if(state.points.length<2)return;
  const visible=Math.max(8,Math.floor(state.points.length/state.zoom));
  const pts=state.points.slice(-visible),min=Math.min(...pts)-2,max=Math.max(...pts)+2,range=max-min||1;
  ctx.beginPath();
  pts.forEach((v,i)=>{
    const x=i/(pts.length-1)*w,y=h-(v-min)/range*(h-24)-12;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.lineWidth=3;ctx.strokeStyle="#d9dee4";ctx.shadowBlur=8;ctx.shadowColor="rgba(217,222,228,.25)";ctx.stroke();ctx.shadowBlur=0;
}
function tick(){
  const drift=(Math.random()-.47)*5;
  state.price=Math.max(9300,Math.min(9500,state.price+drift));
  state.points.push(state.price);if(state.points.length>120)state.points.shift();
  const digit=Math.floor(Math.abs(Math.round(state.price*100))%10);
  state.digitCounts[digit]++;
  $("price").textContent=state.price.toFixed(2);
  $("change").textContent=(drift>=0?"+":"-")+Math.abs(drift/50*100).toFixed(2)+"%";
  $("priceBadge").textContent=Math.round((state.digitCounts.reduce((a,b)=>a+b,0)?Math.max(...state.digitCounts)/state.digitCounts.reduce((a,b)=>a+b,0)*100:0))+"%";
  renderDigits(digit);drawChart();resolveOpen(digit);
}
function renderDigits(last){
  const total=state.digitCounts.reduce((a,b)=>a+b,0)||1;
  $("digits").innerHTML=state.digitCounts.map((n,i)=>{
    const pct=(n/total*100);
    const cls=i===last?"hot":(pct<8?"loss":"");
    return `<button class="digit ${cls}" data-digit="${i}" title="Select digit ${i}"><strong>${i}</strong><small>${pct.toFixed(1)}%</small></button>`;
  }).join("");
  document.querySelectorAll(".digit").forEach(b=>b.onclick=()=>{state.digit=Number(b.dataset.digit);toast("Digit "+state.digit+" selected")});
}

function openTrade(side){
  if(state.mode==="real"){
    toast("Real-money execution is disabled until a verified trading/payment backend is connected.");
    return;
  }
  if(state.stake>activeBalance()){toast("Insufficient demo balance.");return}
  setActiveBalance(activeBalance()-state.stake);
  const t={id:crypto.randomUUID?.()||String(Date.now()+Math.random()),mode:state.mode,contract:state.contract,side,stake:state.stake,digit:state.digit,remaining:state.duration,entryDigit:Math.floor(Math.abs(Math.round(state.price*100))%10),created:Date.now()};
  state.open.push(t);toast("Demo trade opened.");recordTrade(t,"open");
}
$("evenBtn").onclick=()=>openTrade(state.contract==="evenodd"?"even":state.contract==="overunder"?"over":"matches");
$("oddBtn").onclick=()=>openTrade(state.contract==="evenodd"?"odd":state.contract==="overunder"?"under":"differs");

function resolveOpen(finalDigit){
  if(!state.open.length)return;
  state.open.forEach(t=>t.remaining--);
  const done=state.open.filter(t=>t.remaining<=0);state.open=state.open.filter(t=>t.remaining>0);
  done.forEach(t=>{
    let win=false;
    if(t.contract==="evenodd")win=t.side==="even"?finalDigit%2===0:finalDigit%2!==0;
    if(t.contract==="overunder")win=t.side==="over"?finalDigit>t.digit:finalDigit<t.digit;
    if(t.contract==="matches")win=t.side==="matches"?finalDigit===t.digit:finalDigit!==t.digit;
    const payout=t.stake*1.952;
    const profit=win?payout-t.stake:-t.stake;
    if(win)setActiveBalance(activeBalance()+payout);
    state.session.trades++;if(win)state.session.wins++;else state.session.losses++;state.session.pl+=profit;
    recordTrade({...t,exitDigit:finalDigit,profit,result:win?"WIN":"LOSS"},"closed");
    toast(`${win?"WIN":"LOSS"} • ${profit>=0?"+":""}${fmt(profit)}`);
  });
}
async function recordTrade(t,status){
  if(!sb||!state.user)return;
  try{
    const row={user_id:state.user.id,mode:t.mode,contract_type:t.contract,side:t.side,prediction_digit:t.digit,stake:t.stake,duration_ticks:state.duration,entry_digit:t.entryDigit,exit_digit:t.exitDigit??null,status,profit:t.profit??null};
    const {error}=await sb.from("trades").insert(row);
    if(error)console.warn("Trade recording:",error.message);
  }catch(e){console.warn("Trade recording failed",e)}
}

$("autoBtn").onclick=()=>{state.auto=true;$("autoBtn").classList.add("active");$("manualBtn").classList.remove("active")};
$("manualBtn").onclick=()=>{state.auto=false;$("manualBtn").classList.add("active");$("autoBtn").classList.remove("active")};
$("scannerBtn").onclick=()=>{
  const total=state.digitCounts.reduce((a,b)=>a+b,0)||1;
  const sorted=state.digitCounts.map((n,i)=>({i,p:n/total})).sort((a,b)=>b.p-a.p);
  openModal("AI Scanner","Statistical market snapshot — not a guarantee of the next outcome.",
    `<div style="display:grid;gap:8px">${sorted.slice(0,5).map(x=>`<div style="display:flex;justify-content:space-between;background:#17212b;padding:10px;border-radius:10px"><b>Digit ${x.i}</b><span>${(x.p*100).toFixed(1)}%</span></div>`).join("")}</div><p style="margin-top:14px">The scanner uses recent observed ticks only. It does not secretly alter trade outcomes.</p>`);
};

$("zoomIn").onclick=()=>{state.zoom=Math.min(3,state.zoom+0.35);drawChart()};
$("zoomOut").onclick=()=>{state.zoom=Math.max(1,state.zoom-.35);drawChart()};

$("accountPill").onclick=()=>{
  openModal("Account mode","Choose the account used by the terminal.",
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button id="chooseDemo" class="btn-dark" style="padding:14px">Demo<br><b>${fmt(state.demoBalance)}</b></button>
      <button id="chooseReal" class="btn-dark" style="padding:14px">Real<br><b>${fmt(state.realBalance)}</b></button>
    </div>`);
  setTimeout(()=>{
    $("chooseDemo").onclick=()=>{state.mode="demo";renderBalance();closeModal();toast("Demo account selected")};
    $("chooseReal").onclick=()=>{state.mode="real";renderBalance();closeModal();toast("Real account selected")};
  },0);
};
$("depositBtn").onclick=()=>depositDialog();
function depositDialog(){
  if(state.mode==="demo"){openModal("Demo account","Demo balance is simulated for testing.",`<p>You can use demo funds for practice. Real deposits are not created in browser code.</p>`);return}
  openModal("Deposit","Connect a verified payment provider to fund the real account.",`<p>This button is intentionally a UI entry point. It does not fabricate real-money balances.</p>`);
}
$("drawerDeposit").onclick=()=>{closeDrawer();depositDialog()};
$("drawerWithdraw").onclick=()=>{closeDrawer();openModal("Withdraw","Real withdrawals require a verified payment provider and server-side balance controls.","<p>No browser-side code can create or fake a real withdrawal.</p>")};
$("drawerHistory").onclick=()=>{closeDrawer();openModal("History","Trade history is recorded to Supabase when the <code>trades</code> table and policies are configured.","<p>Recent local session: "+state.session.trades+" trades.</p>")};
$("bellBtn").onclick=()=>toast("No new notifications.");
$("themeBtn").onclick=()=>toast("Dark theme is active.");
$("themeDrawer").onclick=()=>{$("themeSwitch").classList.toggle("on");toast("Dark theme remains active for this terminal.")};
$("referBtn").onclick=()=>{closeDrawer();openModal("Refer & Earn","Referral rewards can be connected to a server-side referral system.","<p>Do not credit real rewards from client-side JavaScript.</p>")};
$("helpBtn").onclick=()=>{closeDrawer();openModal("Help Centre","TradeHub support","<p>For real-money support, connect this section to your verified support channel.</p>")};
$("responsibleBtn").onclick=()=>{closeDrawer();openModal("Responsible Trading","Trade only with funds you can afford to lose.","<p>Set sensible stake limits and stop when trading is no longer comfortable.</p>")};
$("chatBtn").onclick=()=>{closeDrawer();openModal("Live Chat","Support chat placeholder","<p>Connect a secure support/chat provider here.</p>")};
$("drawerLogout").onclick=()=>{closeDrawer();logout()};

function openDrawer(){$("drawerBackdrop").classList.remove("hidden")}
function closeDrawer(){$("drawerBackdrop").classList.add("hidden")}
$("menuBtn").onclick=openDrawer;
$("drawerBackdrop").addEventListener("click",e=>{if(e.target===$("drawerBackdrop"))closeDrawer()});

$("positionsTab").onclick=()=>openModal("Positions","Open positions","<p>"+(state.open.length?state.open.length+" open demo position(s).":"No open positions.")+"</p>");
$("tradeTab").onclick=()=>toast("Trade view active");

function drawerClock(){ $("drawerTime").textContent=new Date().toISOString().replace("T"," ").slice(0,19)+" GMT" }
setInterval(drawerClock,1000);drawerClock();

async function init(){
  renderBalance();renderStake();renderContract();resizeCanvas();renderDigits(0);
  if(!sb){$("authMessage").textContent="Authentication service could not be initialized.";return}
  const {data}=await sb.auth.getSession();
  if(data?.session?.user)await enterApp(data.session.user);
  sb.auth.onAuthStateChange(async(_event,session)=>{
    if(session?.user && !state.user)await enterApp(session.user);
  });
}
window.addEventListener("resize",resizeCanvas);
init();
setInterval(tick,1000);
</script>
</body>
