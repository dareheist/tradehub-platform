<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Platform Interface Dashboard</title>
    <style>
        :root {
            --bg-deep: #06090e;
            --bg-surface: #0f141c;
            --bg-panel: #161f2b;
            --bg-input: #1e293b;
            --border-muted: #243242;
            
            --text-bright: #ffffff;
            --text-normal: #cbd5e1;
            --text-muted: #64748b;
            
            --brand-green: #00c853;
            --brand-red: #ff3d00;
            --brand-gold: #ffb300;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-normal);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Control Bar */
        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-muted);
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .brand-zone {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--brand-gold), var(--brand-green));
            border-radius: 6px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: 0.5px;
        }

        .user-meta-zone {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .balance-pill {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-muted);
            border-radius: 20px;
            padding: 6px 16px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .balance-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .balance-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--brand-gold);
        }

        /* Main Workspace Interface Layout Grid */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 340px;
            flex: 1;
            overflow: hidden;
        }

        .chart-workspace-container {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-deep);
            position: relative;
            overflow: hidden;
        }

        /* Asset Selector Navigation Strip */
        .asset-bar {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-muted);
            height: 45px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 5px;
            overflow-x: auto;
        }

        .asset-tab {
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            transition: all 0.2s;
        }

        .asset-tab.active {
            background-color: var(--bg-panel);
            color: var(--text-bright);
            border: 1px solid var(--border-muted);
        }

        /* Canvas Chart Window Area */
        .viewport-frame {
            flex: 1;
            position: relative;
            padding: 20px;
        }

        .ticker-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            background-color: rgba(15, 20, 28, 0.85);
            border: 1px solid var(--border-muted);
            padding: 10px 15px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }

        .ticker-pair {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-bright);
        }

        .ticker-live-price {
            font-size: 22px;
            font-weight: 700;
            margin-top: 2px;
            font-family: monospace;
        }

        .ticker-live-price.up { color: var(--brand-green); }
        .ticker-live-price.down { color: var(--brand-red); }

        .svg-chart-layer {
            width: 100%;
            height: 100%;
        }

        /* Order Panel Management Station */
        .order-station {
            background-color: var(--bg-surface);
            border-left: 1px solid var(--border-muted);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            overflow-y: auto;
        }

        .panel-heading {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-bright);
            margin-bottom: 5px;
        }

        .control-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-block label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .field-frame {
            background-color: var(--bg-input);
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }

        .field-frame input, .field-frame select {
            width: 100%;
            height: 44px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-bright);
            font-size: 16px;
            font-weight: 600;
        }

        .field-frame select {
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .yield-matrix-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .matrix-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .matrix-value-payout {
            color: var(--brand-green);
            font-weight: 700;
        }

        .matrix-value-return {
            color: var(--text-bright);
            font-weight: 700;
            font-size: 15px;
        }

        /* Action Buttons Area */
        .execution-block {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-execution {
            border: none;
            height: 56px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            transition: opacity 0.15s ease;
        }

        .btn-execution:hover { opacity: 0.9; }
        .btn-execution:active { opacity: 0.8; }

        .btn-higher { background-color: var(--brand-green); }
        .btn-lower { background-color: var(--brand-red); }

        /* Bottom History Console */
        .history-console {
            height: 160px;
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-muted);
            display: flex;
            flex-direction: column;
        }

        .console-tab-strip {
            background-color: var(--bg-deep);
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-muted);
        }

        .console-tab {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-bright);
        }

        .console-feed-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
        }

        .log-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(36, 50, 66, 0.3);
            font-size: 12px;
        }

        .log-dir-up { color: var(--brand-green); font-weight: 600; }
        .log-dir-down { color: var(--brand-red); font-weight: 600; }
        .log-time-badge { font-family: monospace; background: var(--bg-input); padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Header Frame -->
    <header>
        <div class="brand-zone">
            <div class="brand-logo"></div>
            <div class="brand-name">PALOPTION-FI</div>
        </div>
        <div class="user-meta-zone">
            <div class="balance-pill">
                <span class="balance-label">Demo Wallet Balance</span>
                <span id="displayBalance" class="balance-value">$10,000.00</span>
            </div>
        </div>
    </header>

    <!-- App Shell Frame Layout -->
    <div class="workspace">
