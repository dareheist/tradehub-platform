<script>

  // Application state and utility helpers.
  // These were missing from the original file and caused the page to stop
  // with "ReferenceError: state is not defined".
  const state = {
    theme: localStorage.getItem("th_theme") || "dark",
    auth: "login",
    session: null,
    user: null,

    mode: "demo",
    contract: "evenodd",
    tradeMode: "auto",

    demo: 10000,
    real: 0,
    stake: 1,
    takeProfit: 100,
    stopLoss: 50,
    multiplier: 1,

    running: false,
    side: null,
    tradeStartedAt: null,
    tradeStartBalance: 0,
    tradePnl: 0,

    sessionWins: 0,
    sessionLosses: 0,
    history: [],
    ticks: [],
    lastDigit: 0,
    timer: null
  };

  const root = document.getElementById("root");

  function money(value) {
    return "$" + Number(value || 0).toFixed(2);
  }

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  function esc(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

const SUPABASE_URL = "https://xtozqmsknvevqvpiixjh.supabase.co";
const SUPABASE_KEY = "sb_publishable_BuowVIbc-HpcfSVjuNZbEA__614eSfJ";

// REST-only authentication. This avoids depending on a third-party Supabase
// JavaScript CDN, which was the component failing on the deployed page.
let supabase = null;

function saveAuthSession(session,user){
  if(session) localStorage.setItem("th_auth_session", JSON.stringify(session));
  if(user) localStorage.setItem("th_auth_user", JSON.stringify(user));
}
function getSavedSession(){
  try{
    const session=JSON.parse(localStorage.getItem("th_auth_session")||"null");
    const user=JSON.parse(localStorage.getItem("th_auth_user")||"null");
    return {session,user};
  }catch(e){return {session:null,user:null}}
}
function clearAuthSession(){
  localStorage.removeItem("th_auth_session");
  localStorage.removeItem("th_auth_user");
}
async function supabaseAuth(path,body){
  const res=await fetch(SUPABASE_URL+"/auth/v1/"+path,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY
    },
    body:JSON.stringify(body)
  });
  let data=null;
  try{data=await res.json()}catch(e){}
  if(!res.ok){
    const message=data?.msg||data?.message||data?.error_description||data?.error||"Authentication request failed.";
    throw new Error(message);
  }
  return data;
}
async function signInWithPassword(email,password){
  const data=await supabaseAuth("token?grant_type=password",{email,password});
  return {data:{session:data,user:data.user}};
}
async function signUp(email,password,name){
  const data=await supabaseAuth("signup",{email,password,data:{full_name:name}});
  return {data:{session:data.session||null,user:data.user||null}};
}
async function resetPassword(email,redirectTo){
  return await supabaseAuth("recover",{email,redirect_to:redirectTo});
}
async function signOut(){
  const saved=getSavedSession();
  if(saved.session?.access_token){
    try{
      await fetch(SUPABASE_URL+"/auth/v1/logout",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+saved.session.access_token
        }
      });
    }catch(e){}
  }
  clearAuthSession();
}


function renderAuth(){
  root.className=state.theme==="light"?"theme-light":"";
  root.innerHTML=`
  <main class="screen dots auth">
    <div class="brand">
      <div class="logo">↗</div><h1>Trade<span>Hub</span></h1>
      <button class="theme" id="themeBtn">${state.theme==="dark"?"☼":"☾"}</button>
    </div>
    <h2>${state.auth==="login"?"Welcome back":"Create your account"}</h2>
    <div class="sub">${state.auth==="login"?"Sign in to your account to continue trading":"Register a TradeHub account to start with demo trading"}</div>
    <form id="authForm">
      ${state.auth==="signup"?`<label class="label">Full name</label><div class="field"><input id="name" required autocomplete="name" placeholder="Your name"></div>`:""}
      <label class="label">Email</label>
      <div class="field"><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div>
      <label class="label">Password</label>
      <div class="field"><input id="password" type="password" required minlength="6" autocomplete="${state.auth==="login"?"current-password":"new-password"}" placeholder="Enter your password"></div>
      ${state.auth==="login"?`<div class="row"><label class="check"><input type="checkbox" id="remember" checked> Remember me</label><span class="link" id="forgot">Forgot password?</span></div>`:""}
      <button class="primary" type="submit">${state.auth==="login"?"Sign In  →":"Create Account  →"}</button>
      <div id="authMsg" class="msg"></div>
    </form>
    <div class="switch">${state.auth==="login"?`Don't have an account? <b id="switch">Create account</b>`:`Already have an account? <b id="switch">Sign in</b>`}</div>
    <div class="auth-foot">TradeHub demo terminal • Secure Supabase authentication</div>
  </main>`;

async function handleAuth(e){
  e.preventDefault();
  const msg=document.getElementById("authMsg");
  msg.textContent="";
  msg.className="msg";
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email || !password){
    msg.textContent="Enter your email and password.";
    return;
  }

  try{
    if(state.auth==="login"){
      const result=await signInWithPassword(email,password);
      state.session=result.data.session;
      state.user=result.data.user;
      saveAuthSession(state.session,state.user);
      await loadUserData();
      renderApp();
    }else{
      const name=document.getElementById("name").value.trim();
      const result=await signUp(email,password,name);
      state.session=result.data.session;
      state.user=result.data.user;

      if(state.session){
        saveAuthSession(state.session,state.user);
        await loadUserData();
        renderApp();
      }else{
        msg.textContent="Account created. Check your email if email confirmation is enabled.";
        msg.className="msg ok";
      }
    }
  }catch(err){
    msg.textContent=err.message||"Authentication failed.";
  }
}

async function forgotPassword(){
  const email=document.getElementById("email").value.trim();
  const msg=document.getElementById("authMsg");
  if(!email){msg.textContent="Enter your email first.";return}
  try{
    const redirect=location.href.split("#")[0];
    await resetPassword(email,redirect);
    msg.textContent="Password reset email sent.";
    msg.className="msg ok";
  }catch(err){
    msg.textContent=err.message||"Could not send the reset email.";
  }
}

  await signOut();

}

function placeOrStop(side){
  if(state.contract!=="evenodd"){
    alert("This demo build currently executes Even/Odd contracts. Select Even/Odd to trade.");
    return;
  }
  if(state.running){
    if(state.tradeMode==="auto" && state.side===side) stopTrade("Manual stop");
    return;
  }
  if(state.mode==="real"){alert("Real-money execution is not connected in this safe build. Switch to Demo until a compliant server-side payment/trading backend is connected.");return}
  startTrade(side);
}
function startTrade(side){
  if(state.stake>state.demo){alert("Demo balance is too low for this stake.");return}
  state.side=side;state.running=true;state.tradeStartedAt=Date.now();state.tradeStartBalance=state.demo;state.tradePnl=0;
  renderApp();
}
function stopTrade(reason="Manual stop"){
  if(!state.running)return;
  state.running=false;
  if(state.tradePnl!==0){
    state.history.unshift({time:new Date().toLocaleTimeString(),side:state.side,pnl:state.tradePnl,reason});
  }
  state.side=null;state.tradePnl=0;
  if(state.timer){clearInterval(state.timer);state.timer=null}
  renderApp();
}
function settleTick(digit){
  if(!state.running)return;
  const win=state.side==="even" ? digit%2===0 : digit%2===1;
  const delta=win ? state.stake*.975*state.multiplier : -state.stake;
  state.demo=+(state.demo+delta).toFixed(2);
  state.tradePnl=+(state.tradePnl+delta).toFixed(2);
  if(win)state.sessionWins++;else state.sessionLosses++;
  const targetReached=state.tradePnl>=state.takeProfit || state.tradePnl<=-Math.abs(state.stopLoss);
  if(targetReached){
    const reason=state.tradePnl>=state.takeProfit?"Take profit reached":"Stop loss reached";
    stopTrade(reason);
    return;
  }
  if(state.tradeMode==="manual"){
    // Manual mode deliberately has no stop control: it continues until a
    // configured profit/loss boundary is reached.
  }
  updateLiveUI();
}
function tick(){
  const last=state.ticks.length?state.ticks[state.ticks.length-1].value:10000;
  const value=+(last+(Math.random()-.5)*9).toFixed(2);
  const digit=Math.floor(Math.abs(Math.round(value*100)))%10;
  state.ticks.push({value,digit});if(state.ticks.length>65)state.ticks.shift();state.lastDigit=digit;
  if(state.running)settleTick(digit);
  else {updateLiveUI()}
}
function renderDigits(){
  const counts=Array(10).fill(0);
  state.ticks.forEach(t=>counts[t.digit]++);
  const total=Math.max(1,state.ticks.length);
  const raw=counts.map(c=>c/total*100);
  const smoothed=raw.map((p,i)=>{
    const left=raw[(i+9)%10], right=raw[(i+1)%10];
    return Math.max(.1,left*.12+p*.76+right*.12);
  });
  const sum=smoothed.reduce((a,b)=>a+b,0)||100;
  const digits=document.getElementById("digits");
  if(!digits)return;
  digits.innerHTML=smoothed.map((p,i)=>{
    const pct=(p/sum*100).toFixed(1);
    const current=i===state.lastDigit;
    let cls=current?"current":"";
    if(current && state.running){
      const win=(state.side==="even"&&i%2===0)||(state.side==="odd"&&i%2===1);
      cls += " "+(win?"win":"loss");
    }
    return `<div class="digit ${cls}"><strong>${i}</strong><small>${pct}%</small></div>`;
  }).join("");
}
function drawChart(){
  const svg=document.getElementById("chartSvg"), W=720,H=410;
  const vals=state.ticks.length?state.ticks.map(t=>t.value):[10000,10002,9998,10005];
  const min=Math.min(...vals)-5,max=Math.max(...vals)+5;
  let grid="";
  for(let x=0;x<=W;x+=72)grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#1b2737" stroke-width="1"/>`;
  for(let y=0;y<=H;y+=55)grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#1b2737" stroke-width="1"/>`;
  const pts=vals.map((v,i)=>`${(i/(Math.max(1,vals.length-1)))*W},${H-((v-min)/(max-min))*H}`).join(" ");
  const area=`0,${H} ${pts} ${W},${H}`;
  svg.innerHTML=`${grid}<polygon points="${area}" fill="rgba(180,190,205,.10)"/><polyline points="${pts}" fill="none" stroke="#d7dce5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
  const current=vals[vals.length-1]||0;
  document.getElementById("price").textContent=current.toFixed(2);
  const change=vals.length>10?((current-vals[0])/vals[0]*100):0;
  document.getElementById("quote").innerHTML=`${current.toFixed(2)} <i style="color:${change>=0?"var(--green)":"var(--red)"}">${change>=0?"+":""}${change.toFixed(2)}%</i>`;
}

  const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="modal-card"><div class="modal-head"><h3>${type==="deposit"?"Deposit":"Withdraw"}</h3><button class="close">×</button></div>
  <p style="color:#98a4b7">This interface is prepared for a real payment provider, but no real-money movement is enabled in this build.</p>
  <label class="label">Amount</label><div class="field"><input id="moneyAmount" type="number" min="1" step=".01" placeholder="0.00"></div>
  <button class="primary" id="moneyAction">${type==="deposit"?"Continue to payment":"Request withdrawal"}</button>
  <div class="msg ok" id="moneyMsg"></div></div>`;
  document.body.appendChild(m);m.querySelector(".close").onclick=()=>m.remove();
  m.querySelector("#moneyAction").onclick=()=>{m.querySelector("#moneyMsg").textContent="Connect a licensed payment processor/server endpoint here before enabling real-money transactions.";};
}
function openHistory(){
  const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="modal-card"><div class="modal-head"><h3>Trade history</h3><button class="close">×</button></div><div class="history">${state.history.length?state.history.slice(0,30).map(t=>`<div class="trade-item"><span>${esc(t.time)} · ${esc(t.side)}<br><small>${esc(t.reason)}</small></span><b class="${t.pnl>=0?"green":"red"}">${t.pnl>=0?"+":""}${money(t.pnl)}</b></div>`).join(""):"<p style='color:#8e99aa'>No completed trades yet.</p>"}</div></div>`;
  document.body.appendChild(m);m.querySelector(".close").onclick=()=>m.remove();
}
function openScanner(){
  const m=document.createElement("div");
  m.className="modal";
  m.innerHTML=`<div class="modal-card">
    <div class="modal-head">
      <div style="display:flex;gap:12px;align-items:center">
        <div class="scanner-icon">✧</div><h3>Entry Scanner</h3>
      </div>
      <button class="close">×</button>
    </div>
    <div class="scan-info">Select a market category. The scanner evaluates the recent demo tick distribution and volatility. It is an analysis aid, not a guarantee of profit.</div>
    <label class="label">Market</label>
    <select class="select" id="scanMarket">
      <option>Even / Odd</option>
      <option>Matches / Differs</option>
      <option>Over / Under</option>
    </select>
    <div style="display:flex;justify-content:space-between;margin-top:22px;font-weight:900">
      <span>Ready to scan</span><span id="scanCount">0/13</span>
    </div>
    <div class="progress"><i id="scanProgress"></i></div>
    <button class="scan" id="scanGo">⌕ Deep Scan for Best Market</button>
    <div id="scanResult"></div>
  </div>`;

  document.body.appendChild(m);
  m.querySelector(".close").onclick=()=>m.remove();

  m.querySelector("#scanGo").onclick=()=>{
    const bar=m.querySelector("#scanProgress");
    const count=m.querySelector("#scanCount");
    const btn=m.querySelector("#scanGo");

    btn.disabled=true;
    let n=0;

    const iv=setInterval(()=>{
      n++;
      bar.style.width=(n/13*100)+"%";
      count.textContent=n+"/13";

      if(n===13){
        clearInterval(iv);

        const values=state.ticks.map(t=>t.value);
        const mean=values.length
          ? values.reduce((a,b)=>a+b,0)/values.length
          : 0;

        const vol=values.length
          ? Math.sqrt(values.reduce((sum,x)=>sum+(x-mean)**2,0)/values.length)
          : 0;

        const even=state.ticks.filter(t=>t.digit%2===0).length;
        const odd=state.ticks.length-even;
        const rec=even>=odd?"Even":"Odd";

        m.querySelector("#scanResult").innerHTML=
          `<div class="scan-result">
            <b>Scan complete</b>
            <p>Recent volatility: <strong>${vol.toFixed(2)}</strong></p>
            <p>Current distribution: Even ${even} · Odd ${odd}</p>
            <p>Demo analysis suggests <strong>${rec}</strong> has the stronger recent frequency.</p>
          </div>`;

        btn.textContent="Scan complete";
      }
    },80);
  };
}
async function loadUserData(){
  const uid=state.user?.id;if(!uid)return;
  const key="th_user_"+uid;
  try{const saved=JSON.parse(localStorage.getItem(key)||"{}");Object.assign(state,{demo:saved.demo??10000,real:saved.real??0,history:saved.history??[]})}catch{}
}
function saveUserData(){
  const uid=state.user?.id;if(!uid)return;
  localStorage.setItem("th_user_"+uid,JSON.stringify({demo:state.demo,real:state.real,history:state.history}));
}

// Restore a saved session locally. No Supabase JavaScript SDK is required.
const savedAuth=getSavedSession();
state.session=savedAuth.session;
state.user=savedAuth.user;
if(state.user && state.session){
  loadUserData().then(()=>renderApp()).catch(()=>renderApp());
}else{
  renderAuth();
}
state.ticks=[];
for(let i=0;i<65;i++){const prev=state.ticks.length?state.ticks[state.ticks.length-1].value:10000;const value=+(prev+(Math.random()-.5)*8).toFixed(2);state.ticks.push({value,digit:Math.floor(Math.abs(Math.round(value*100)))%10})}
state.lastDigit=state.ticks[state.ticks.length-1].digit;
setInterval(()=>{if(state.user)tick()},1000);
setInterval(saveUserData,5000);
</script>
