<html lang="en">
<head>

<title>TradeHub — Trading Terminal</title>
<style>
:root{
  --bg:#071018;--panel:#0d1722;--panel2:#121f2d;--line:#223246;
  --text:#f4f7fb;--muted:#8b99ab;--green:#18d39b;--green2:#05ad7d;
  --red:#ff4f73;--blue:#4d8dff;--orange:#ffb347;--shadow:0 18px 55px rgba(0,0,0,.35)
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#root{min-height:100dvh}
.auth{min-height:100dvh;max-width:720px;margin:auto;padding:28px 20px 50px;background:
 radial-gradient(circle at 15% 8%,rgba(24,211,155,.12),transparent 28%),
 radial-gradient(circle at 90% 75%,rgba(77,141,255,.10),transparent 30%)}
.brand{display:flex;align-items:center;gap:12px;margin:20px 0 44px}.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--green),#079f79);display:grid;place-items:center;color:#04110d;font-size:25px;font-weight:950}.brand h1{margin:0;font-size:28px;letter-spacing:-1px}.brand span{color:var(--green)}.brand small{display:block;color:var(--muted);margin-top:3px}
.auth-card{background:rgba(13,23,34,.88);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;padding:24px}.auth-card h2{margin:0 0 8px;font-size:30px}.sub{color:var(--muted);margin:0 0 24px;line-height:1.5}.tabs{display:flex;background:#08111a;border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:22px}.tabs button{flex:1;padding:12px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:800}.tabs button.active{background:#1a2938;color:#fff}
.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;color:#b9c3d0;margin:0 0 8px}.field input{width:100%;height:52px;padding:0 15px;border-radius:13px;border:1px solid #2b3a4d;background:#08111a;color:#fff;outline:none}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(24,211,155,.10)}
.primary{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(135deg,var(--green),#0aae80);color:#042019;font-weight:950;margin-top:10px}.primary:disabled{opacity:.6;cursor:wait}.auth-link{margin-top:15px;color:var(--muted);font-size:14px;text-align:center}.auth-link b{color:var(--green);cursor:pointer}.msg{min-height:20px;margin-top:14px;font-size:13px;line-height:1.45;color:#ff879f}.msg.ok{color:var(--green)}.forgot{color:var(--blue);font-size:13px;cursor:pointer;margin-top:8px;display:inline-block}.notice{margin-top:18px;padding:12px;border-radius:12px;background:#0a1420;border:1px solid #203249;color:#91a0b3;font-size:12px;line-height:1.45}
.app{min-height:100dvh;max-width:1180px;margin:auto;padding-bottom:92px}.top{position:sticky;top:0;z-index:10;background:rgba(7,16,24,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:10px 14px}.toprow{display:flex;align-items:center;gap:10px}.menu{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:#fff;font-size:20px}.appbrand{font-weight:950;font-size:20px}.appbrand span{color:var(--green)}.account{margin-left:auto;text-align:right}.account small{display:block;color:var(--muted);font-size:10px}.account b{font-size:16px}.deposit{border:0;background:var(--green);color:#062219;padding:11px 14px;border-radius:12px;font-weight:950}
.modebar{display:flex;gap:7px;margin-top:10px}.modebar button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px;border-radius:10px;font-weight:850}.modebar button.active{border-color:rgba(24,211,155,.6);background:rgba(24,211,155,.11);color:var(--green)}
.main{padding:14px;display:grid;gap:14px}.card{background:linear-gradient(180deg,var(--panel),#0b1520);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 25px rgba(0,0,0,.12)}.market{padding:15px}.marketrow{display:flex;align-items:center;gap:8px}.select{flex:1;background:#09131d;border:1px solid var(--line);color:#fff;padding:11px;border-radius:11px;min-width:0}.live{font-size:10px;font-weight:900;color:var(--green);padding:6px 8px;border-radius:999px;background:rgba(24,211,155,.12)}
.quote{display:flex;align-items:end;justify-content:space-between;margin:14px 0 5px}.quote strong{font-size:29px;letter-spacing:-1px}.quote span{color:var(--muted);font-size:12px}.quote .digitbig{color:var(--green);font-size:34px;font-weight:950}
.chartwrap{height:250px;position:relative;border-radius:14px;overflow:hidden;background:#08111a;border:1px solid #172638}.gridline{position:absolute;inset:0;background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:100% 25%,20% 100%;pointer-events:none}.chart{position:absolute;inset:0;width:100%;height:100%}.chartmeta{display:flex;justify-content:space-between;padding:10px 2px 0;color:var(--muted);font-size:11px}
.contracts{display:flex;gap:7px;padding:7px;overflow:auto;border-bottom:1px solid var(--line)}.contract{white-space:nowrap;border:1px solid var(--line);background:#09131d;color:var(--muted);padding:9px 11px;border-radius:10px;font-size:12px;font-weight:850}.contract.active{background:rgba(77,141,255,.15);border-color:var(--blue);color:#dbe8ff}
.digits{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:12px}.digit{min-width:0;text-align:center;border-radius:9px;padding:8px 2px;background:#09131d;border:1px solid #1c2a3b}.digit b{display:block;font-size:15px}.digit small{font-size:9px;color:var(--muted)}.digit.current{border-color:var(--green);box-shadow:0 0 0 1px rgba(24,211,155,.25)}.digit.win{background:rgba(24,211,155,.12)}.digit.loss{background:rgba(255,79,115,.12)}
.tradecard{overflow:hidden}.tradehead{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--line)}.tradehead b{font-size:15px}.statusdot{color:var(--green);font-size:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.control label{display:block;font-size:10px;color:var(--muted);font-weight:850;margin-bottom:6px}.control input,.control select{width:100%;background:#08111a;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}
.sidebuttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}.side{border:0;border-radius:13px;padding:15px;font-weight:950;color:#071018}.side.up{background:var(--green)}.side.down{background:var(--red);color:#fff}.side small{display:block;opacity:.75;margin-top:4px}.side.running{outline:3px solid #fff4}
.power{padding:0 14px 14px}.power label{font-size:10px;color:var(--muted);font-weight:850}.powerrow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}.powerrow button{padding:10px;border-radius:10px;border:1px solid var(--line);background:#09131d;color:var(--muted);font-weight:900}.powerrow button.active{background:rgba(255,179,71,.12);border-color:var(--orange);color:var(--orange)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.summary div{padding:12px;border-right:1px solid var(--line)}.summary div:last-child{border-right:0}.summary small{display:block;color:var(--muted);font-size:9px}.summary b{font-size:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(10,19,29,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:12}.bottomin{width:min(1180px,100%);display:flex}.bottom button{flex:1;padding:15px;border:0;background:transparent;color:var(--muted);font-weight:850}.bottom button.active{color:var(--green)}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none}.drawer.open{display:block}.drawerpanel{width:min(330px,86vw);height:100%;background:#0b1520;border-right:1px solid var(--line);padding:18px}.drawerhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.drawerpanel button.item{width:100%;text-align:left;margin:5px 0;padding:14px;border-radius:11px;background:#101c29;color:#dce5ef;border:1px solid var(--line);font-weight:800}.drawerpanel .logout{color:#ff879f}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.64);display:grid;place-items:end center;padding:12px}.modalcard{width:min(520px,100%);background:#0d1722;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#172433;color:#fff;border:0;width:36px;height:36px;border-radius:10px}.history{max-height:50dvh;overflow:auto;margin-top:12px}.tradeitem{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.positive{color:var(--green)}.negative{color:var(--red)}
@media(min-width:760px){.main{grid-template-columns:1.45fr .9fr;align-items:start}.market{grid-row:span 2}.tradecard{position:sticky;top:100px}.chartwrap{height:420px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SUPABASE_URL="https://xtozqmsknvevqvpiixjh.supabase.co";
const SUPABASE_KEY="sb_publishable_BuowVIbc-HpcfSVjuNZbEA__614eSfJ";
const AUTH_KEY="tradehub_auth_v2";
const DATA_PREFIX="tradehub_user_v2_";

const state={
  authMode:"login", session:null, user:null, profile:null,
  mode:"demo", demoBalance:10000, realBalance:0,
  market:"Volatility 10 (1s) Index", contract:"evenodd", side:null,
  target:5, duration:1, stake:1, power:1, running:false, ticksLeft:0,
  entryBalance:0, pnl:0, history:[], wins:0, losses:0,
  ticks:[], lastDigit:0, lastPrice:10000, timer:null
};

const $=id=>document.getElementById(id);
const money=n=>"$"+Number(n||0).toFixed(2);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

async function sb(path, options={}){
  const headers={"apikey":SUPABASE_KEY,"Content-Type":"application/json",...(options.headers||{})};
  const res=await fetch(SUPABASE_URL+path,{...options,headers});
  let data=null; try{data=await res.json()}catch{}
  if(!res.ok) throw new Error(data?.msg||data?.message||data?.error_description||"Request failed ("+res.status+")");
  return data;
}
function saveSession(){localStorage.setItem(AUTH_KEY,JSON.stringify({session:state.session,user:state.user}));}
function clearSession(){localStorage.removeItem(AUTH_KEY);}
function userKey(){return DATA_PREFIX+(state.user?.id||"guest");}
function saveLocalData(){if(!state.user)return; localStorage.setItem(userKey(),JSON.stringify({demoBalance:state.demoBalance,realBalance:state.realBalance,history:state.history,wins:state.wins,losses:state.losses}));}
function loadLocalData(){try{const d=JSON.parse(localStorage.getItem(userKey())||"{}");state.demoBalance=d.demoBalance??10000;state.realBalance=d.realBalance??0;state.history=d.history??[];state.wins=d.wins??0;state.losses=d.losses??0}catch{}}

async function signUp(email,password,name){
  return sb("/auth/v1/signup",{method:"POST",body:JSON.stringify({email,password,data:{full_name:name}})});
}
async function signIn(email,password){
  return sb("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password})});
}
async function refreshUser(){
  const token=state.session?.access_token;
  if(!token) return false;
  try{
    const user=await sb("/auth/v1/user",{headers:{Authorization:"Bearer "+token}});
    state.user=user; saveSession(); return true;
  }catch(e){return false}
}
async function signOut(){
  try{if(state.session?.access_token) await sb("/auth/v1/logout",{method:"POST",headers:{Authorization:"Bearer "+state.session.access_token}})}catch{}
  clearSession(); state.session=null; state.user=null; state.profile=null;
}

function renderAuth(){
  root.innerHTML=`<main class="auth">
    <div class="brand"><div class="logo">T</div><div><h1>Trade<span>Hub</span></h1><small>Trading terminal</small></div></div>
    <section class="auth-card">
      <h2>${state.authMode==="login"?"Welcome back":"Create your account"}</h2>
      <p class="sub">${state.authMode==="login"?"Sign in to access your trading dashboard.":"Create a TradeHub account to start with the demo terminal."}</p>
      <div class="tabs"><button id="loginTab" class="${state.authMode==="login"?"active":""}">Login</button><button id="signupTab" class="${state.authMode==="signup"?"active":""}">Create account</button></div>
      <form id="authForm">
        ${state.authMode==="signup"?`<div class="field"><label>Full name</label><input id="name" autocomplete="name" placeholder="Your name" required></div>`:""}
        <div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
        <div class="field"><label>Password</label><input id="password" type="password" autocomplete="${state.authMode==="login"?"current-password":"new-password"}" minlength="6" placeholder="At least 6 characters" required></div>
        <button id="authBtn" class="primary" type="submit">${state.authMode==="login"?"Sign in":"Create account"}</button>
        <div id="authMsg" class="msg"></div>
      </form>
      ${state.authMode==="login"?`<span id="forgot" class="forgot">Forgot password?</span>`:""}
      <div class="auth-link">${state.authMode==="login"?"Don't have an account?":"Already have an account?"} <b id="switchAuth">${state.authMode==="login"?"Create one":"Sign in"}</b></div>
      <div class="notice">If account creation succeeds but you are not signed in automatically, your Supabase project may require email confirmation. The exact result will be shown here.</div>
    </section>
  </main>`;
  $("loginTab").onclick=()=>{state.authMode="login";renderAuth()};
  $("signupTab").onclick=()=>{state.authMode="signup";renderAuth()};
  $("switchAuth").onclick=()=>{state.authMode=state.authMode==="login"?"signup":"login";renderAuth()};
  $("authForm").onsubmit=handleAuth;
  if($("forgot")) $("forgot").onclick=forgotPassword;
}

async function handleAuth(e){
  e.preventDefault();
  const msg=$("authMsg"), btn=$("authBtn");
  msg.className="msg";msg.textContent="";btn.disabled=true;btn.textContent="Please wait…";
  const email=$("email").value.trim(),password=$("password").value;
  try{
    if(state.authMode==="signup"){
      const name=$("name").value.trim();
      if(!name) throw new Error("Please enter your full name.");
      const r=await signUp(email,password,name);
      if(r.session){
        state.session=r.session;state.user=r.user;saveSession();loadLocalData();renderApp();
      }else{
        msg.className="msg ok";
        msg.textContent="Account created successfully. Check your email for the confirmation link, then return here and sign in.";
      }
    }else{
      const r=await signIn(email,password);
      state.session=r; state.user=r.user; saveSession(); loadLocalData(); renderApp();
    }
  }catch(err){
    let text=err.message||"Authentication failed.";
    if(/email not confirmed/i.test(text)) text="Your account exists, but the email has not been confirmed yet. Check your inbox or disable email confirmation in Supabase for testing.";
    if(/invalid login credentials/i.test(text)) text="Incorrect email or password. If this is a new account, create it first or confirm your email.";
    msg.textContent=text;
  }finally{btn.disabled=false;btn.textContent=state.authMode==="login"?"Sign in":"Create account";}
}
async function forgotPassword(){
  const email=$("email").value.trim(),msg=$("authMsg");
  if(!email){msg.textContent="Enter your email address first.";return}
  try{
    await sb("/auth/v1/recover",{method:"POST",body:JSON.stringify({email,redirect_to:location.href.split("#")[0]})});
    msg.className="msg ok";msg.textContent="Password reset request sent. Check your email.";
  }catch(err){msg.textContent=err.message||"Could not send reset email."}
}

function balance(){return state.mode==="demo"?state.demoBalance:state.realBalance}
function payoutRate(){
  if(state.contract==="evenodd") return 1.95;
  if(state.contract==="overunder") return 1.85;
  return state.side==="matches"?9.5:1.12;
}
function potentialProfit(){return state.stake*(payoutRate()-1)*state.power}
function labels(){
  if(state.contract==="evenodd") return ["Even","Odd"];
  if(state.contract==="overunder") return ["Over "+state.target,"Under "+state.target];
  return ["Matches "+state.target,"Differs "+state.target];
}
function sideKeys(){
  if(state.contract==="evenodd") return ["even","odd"];
  if(state.contract==="overunder") return ["over","under"];
  return ["matches","differs"];
}
function isWin(side,digit){
  if(state.contract==="evenodd") return side==="even"?digit%2===0:digit%2!==0;
  if(state.contract==="overunder") return side==="over"?digit>state.target:digit<state.target;
  return side==="matches"?digit===state.target:digit!==state.target;
}
function generateTick(){
  const drift=(Math.random()-.48)*5.2;
  const wave=Math.sin(Date.now()/1700)*.9;
  state.lastPrice=+(state.lastPrice+drift+wave).toFixed(2);
  const digit=Math.abs(Math.round(state.lastPrice*100))%10;
  state.lastDigit=digit;
  state.ticks.push({price:state.lastPrice,digit,time:Date.now()});
  if(state.ticks.length>90)state.ticks.shift();
  if(state.running){
    state.ticksLeft--;
    if(state.ticksLeft<=0) settleTrade(digit);
    else updateLive();
  }else updateLive();
}
function startTrade(side){
  if(state.running) return;
  if(state.mode==="real"){alert("Real trading is not connected yet. TradeHub will not pretend to execute a real trade. Switch to Demo until a licensed server-side trading integration is connected.");return}
  const cost=state.stake*state.power;
  if(cost>state.demoBalance){alert("Your demo balance is too low for this stake and Power level.");return}
  state.side=side;state.running=true;state.ticksLeft=Math.max(1,Number(state.duration)||1);state.entryBalance=state.demoBalance;
  state.demoBalance=+(state.demoBalance-cost).toFixed(2);
  renderApp();
}
function settleTrade(digit){
  const win=isWin(state.side,digit), cost=state.stake*state.power;
  const profit=win?potentialProfit():-cost;
  if(win) state.demoBalance=+(state.demoBalance+cost+potentialProfit()).toFixed(2);
  state.pnl=profit; if(win)state.wins++;else state.losses++;
  state.history.unshift({time:new Date().toLocaleString(),market:state.market,contract:state.contract,side:state.side,digit,stake:state.stake,power:state.power,pnl:profit,result:win?"Win":"Loss"});
  state.running=false;state.side=null;state.ticksLeft=0;saveLocalData();renderApp();
}
function renderDigits(){
  const counts=Array(10).fill(0);state.ticks.forEach(t=>counts[t.digit]++);
  const total=Math.max(1,state.ticks.length);
  return counts.map((c,i)=>`<div class="digit ${i===state.lastDigit?"current":""}"><b>${i}</b><small>${(c/total*100).toFixed(1)}%</small></div>`).join("");
}
function renderApp(){
  const [a,b]=labels(),[sa,sbside]=sideKeys();
  const pnl=state.history.length?state.history[0].pnl:0;
  root.innerHTML=`<main class="app">
    <header class="top"><div class="toprow">
      <button id="menuBtn" class="menu">☰</button><div class="appbrand">Trade<span>Hub</span></div>
      <div class="account"><small>${state.mode==="demo"?"DEMO ACCOUNT":"REAL ACCOUNT"}</small><b id="balanceText">${money(balance())}</b></div>
      <button id="depositBtn" class="deposit">Deposit</button>
    </div><div class="modebar"><button id="demoMode" class="${state.mode==="demo"?"active":""}">DEMO</button><button id="realMode" class="${state.mode==="real"?"active":""}">REAL</button></div></header>
    <div class="main">
      <section class="card market">
        <div class="marketrow"><select id="marketSelect" class="select">
          ${["Volatility 10 (1s) Index","Volatility 25 Index","Volatility 50 (1s) Index","Volatility 75 Index","Volatility 100 (1s) Index"].map(x=>`<option ${x===state.market?"selected":""}>${x}</option>`).join("")}
        </select><span class="live">● LIVE</span></div>
        <div class="quote"><div><span>Last price</span><strong id="price">${state.lastPrice.toFixed(2)}</strong></div><div class="digitbig" id="lastDigit">${state.lastDigit}</div></div>
        <div class="chartwrap"><div class="gridline"></div><svg id="chart" class="chart" viewBox="0 0 900 400" preserveAspectRatio="none"></svg></div>
        <div class="chartmeta"><span>Live simulated demo feed</span><span>${state.ticks.length} ticks</span></div>
        <div class="digits" id="digits">${renderDigits()}</div>
      </section>
      <section class="card tradecard">
        <div class="tradehead"><b>Trade controls</b><span class="statusdot">${state.running?"● RUNNING · "+state.ticksLeft+" tick(s)":"● READY"}</span></div>
        <div class="contracts">
          <button class="contract ${state.contract==="evenodd"?"active":""}" data-contract="evenodd">Even / Odd</button>
          <button class="contract ${state.contract==="overunder"?"active":""}" data-contract="overunder">Over / Under</button>
          <button class="contract ${state.contract==="match"?"active":""}" data-contract="match">Matches / Differs</button>
        </div>
        <div class="formgrid">
          <div class="control"><label>STAKE</label><input id="stake" type="number" min="0.01" step="0.01" value="${state.stake}"></div>
          <div class="control"><label>DURATION (TICKS)</label><select id="duration">${[1,2,3,5,10].map(n=>`<option value="${n}" ${n===Number(state.duration)?"selected":""}>${n}</option>`).join("")}</select></div>
          ${state.contract!=="evenodd"?`<div class="control"><label>${state.contract==="match"?"PREDICTION":"THRESHOLD"}</label><select id="target">${Array.from({length:10},(_,i)=>`<option value="${i}" ${i===state.target?"selected":""}>${i}</option>`).join("")}</select></div><div class="control"><label>POTENTIAL PROFIT</label><input value="${money(potentialProfit())}" disabled></div>`:`<div class="control"><label>POTENTIAL PROFIT</label><input value="${money(potentialProfit())}" disabled></div><div class="control"><label>LAST DIGIT</label><input value="${state.lastDigit}" disabled></div>`}
        </div>
        <div class="power"><label>POWER OPTION</label><div class="powerrow">${[1,2,3].map(p=>`<button data-power="${p}" class="${state.power===p?"active":""}">${p}× Power</button>`).join("")}</div></div>
        <div class="sidebuttons">
          <button id="sideA" class="side up ${state.running&&state.side===sa?"running":""}">${a}<small>Potential +${money(potentialProfit())}</small></button>
          <button id="sideB" class="side down ${state.running&&state.side===sbside?"running":""}">${b}<small>Potential +${money(potentialProfit())}</small></button>
        </div>
        <div class="summary"><div><small>POWER COST</small><b>${money(state.stake*state.power)}</b></div><div><small>WINS / LOSSES</small><b>${state.wins} / ${state.losses}</b></div><div><small>LAST P/L</small><b class="${pnl>=0?"positive":"negative"}">${pnl>=0?"+":""}${money(pnl)}</b></div></div>
      </section>
    </div>
    <nav class="bottom"><div class="bottomin"><button class="active">▥ Trade</button><button id="historyBtn">◷ History</button><button id="profileBtn">◉ Account</button></div></nav>
    <div id="drawer" class="drawer"><div class="drawerpanel"><div class="drawerhead"><b>TradeHub</b><button id="closeDrawer" class="close">×</button></div><div style="color:var(--muted);font-size:12px;margin-bottom:12px">${esc(state.user?.email||"")}</div><button id="historyDrawer" class="item">Trade history</button><button id="accountDrawer" class="item">Account</button><button id="logoutBtn" class="item logout">Log out</button></div></div>
  </main>`;
  bindApp(); drawChart();
}
function bindApp(){
  $("menuBtn").onclick=()=>{$("drawer").classList.add("open")};$("closeDrawer").onclick=()=>{$("drawer").classList.remove("open")};$("drawer").onclick=e=>{if(e.target===$("drawer"))$("drawer").classList.remove("open")};
  $("demoMode").onclick=()=>{state.mode="demo";renderApp()};$("realMode").onclick=()=>{state.mode="real";renderApp()};
  $("marketSelect").onchange=e=>{state.market=e.target.value};
  document.querySelectorAll("[data-contract]").forEach(b=>b.onclick=()=>{if(state.running)return;state.contract=b.dataset.contract;renderApp()});
  document.querySelectorAll("[data-power]").forEach(b=>b.onclick=()=>{if(state.running)return;state.power=Number(b.dataset.power);renderApp()});
  $("stake").onchange=e=>{state.stake=Math.max(.01,Number(e.target.value)||1);renderApp()};
  $("duration").onchange=e=>{state.duration=Number(e.target.value)};
  if($("target")) $("target").onchange=e=>{state.target=Number(e.target.value);renderApp()};
  const keys=sideKeys();$("sideA").onclick=()=>startTrade(keys[0]);$("sideB").onclick=()=>startTrade(keys[1]);
  $("historyBtn").onclick=openHistory;$("historyDrawer").onclick=openHistory;$("profileBtn").onclick=openAccount;$("accountDrawer").onclick=openAccount;
  $("logoutBtn").onclick=async()=>{stopTimer();await signOut();renderAuth()};
  $("depositBtn").onclick=()=>alert("Payment connection will be added through a secure server-side M-PESA endpoint. Your secret credentials must not be placed in index.html.");
}
function updateLive(){
  const p=$("price"),d=$("lastDigit"),dg=$("digits");if(p)p.textContent=state.lastPrice.toFixed(2);if(d)d.textContent=state.lastDigit;if(dg)dg.innerHTML=renderDigits();drawChart();
}
function drawChart(){
  const svg=$("chart");if(!svg||state.ticks.length<2)return;
  const vals=state.ticks.map(t=>t.price),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
  const pts=vals.map((v,i)=>`${i/(vals.length-1)*900},${380-(v-min)/range*340}`).join(" ");
  svg.innerHTML=`<polyline points="${pts}" fill="none" stroke="#18d39b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="${380-(state.lastPrice-min)/range*340}" x2="900" y2="${380-(state.lastPrice-min)/range*340}" stroke="#18d39b55" stroke-dasharray="10 10"/>`;
}
function openHistory(){
  const rows=state.history.length?state.history.map(t=>`<div class="tradeitem"><span><b>${esc(t.result)}</b> · ${esc(t.side)}<br><small style="color:var(--muted)">${esc(t.time)} · Digit ${t.digit} · Stake ${money(t.stake)} · ${t.power}×</small></span><b class="${t.pnl>=0?"positive":"negative"}">${t.pnl>=0?"+":""}${money(t.pnl)}</b></div>`).join(""):`<p style="color:var(--muted)">No completed trades yet.</p>`;
  document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modalcard"><div class="modalhead"><b>Trade history</b><button class="close" id="modalClose">×</button></div><div class="history">${rows}</div></div></div>`);
  $("modalClose").onclick=()=>$("modal").remove();
}
function openAccount(){
  document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modalcard"><div class="modalhead"><b>Account</b><button class="close" id="modalClose">×</button></div><div class="history"><p><b>Email:</b> ${esc(state.user?.email||"")}</p><p><b>Demo balance:</b> ${money(state.demoBalance)}</p><p><b>Real balance:</b> ${money(state.realBalance)}</p><p style="color:var(--muted);font-size:13px;line-height:1.5">Demo trading works locally. Real-money trading and M-PESA deposits are intentionally not simulated as real transactions; they require a secure server-side integration.</p></div></div></div>`);
  $("modalClose").onclick=()=>$("modal").remove();
}
function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}
async function boot(){
  for(let i=0;i<70;i++){state.lastPrice=+(state.lastPrice+(Math.random()-.5)*6).toFixed(2);const digit=Math.abs(Math.round(state.lastPrice*100))%10;state.ticks.push({price:state.lastPrice,digit,time:Date.now()-((70-i)*1000)});state.lastDigit=digit}
  try{const saved=JSON.parse(localStorage.getItem(AUTH_KEY)||"null");if(saved?.session){state.session=saved.session;state.user=saved.user;if(await refreshUser()){loadLocalData();renderApp()}else{clearSession();renderAuth()}}else renderAuth()}catch{clearSession();renderAuth()}
  stopTimer();state.timer=setInterval(()=>{if(state.user)generateTick()},1000);
}
boot();
</script>
</body>
</html>
