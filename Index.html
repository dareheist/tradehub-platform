<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeHub Trading</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red: #ff3b30;
      --green: #18a66b;
      --dark: #101820;
      --dark2: #17232c;
      --border: #e2e6e9;
      --bg: #f5f6f7;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: #20252b;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* AUTH */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #07151d, #1a303c);
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .logo span,
    .brand span {
      color: var(--red);
    }

    .auth-subtitle {
      text-align: center;
      color: #747b82;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      background: #f0f2f3;
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      border: 0;
      padding: 11px;
      background: transparent;
      border-radius: 6px;
      font-weight: 700;
      color: #6b7280;
    }

    .tabs button.active {
      background: white;
      color: #111;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5d9dc;
      border-radius: 7px;
      outline: none;
      background: white;
    }

    .auth-button {
      width: 100%;
      border: 0;
      background: var(--red);
      color: white;
      padding: 13px;
      border-radius: 7px;
      font-weight: 900;
    }

    .message {
      display: none;
      padding: 10px;
      border-radius: 7px;
      background: #fff0ef;
      color: #c62828;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .message.success {
      background: #ecfdf3;
      color: #087443;
    }

    /* APP */

    #app {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      height: 64px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 23px;
      font-weight: 900;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .account-switch {
      display: flex;
      background: #f0f2f3;
      padding: 3px;
      border-radius: 7px;
    }

    .account-switch button {
      border: 0;
      padding: 8px 12px;
      border-radius: 5px;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
    }

    .account-switch button.active {
      background: #17232c;
      color: white;
    }

    .balance {
      padding: 9px 12px;
      background: #f4f5f6;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 900;
    }

    .logout {
      border: 0;
      background: #17232c;
      color: white;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 800;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 64px);
    }

    /* SIDEBAR */

    .sidebar {
      background: #17232c;
      color: white;
      padding: 15px 10px;
    }

    .side-title {
      color: #87939c;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      padding: 12px 10px 7px;
    }

    .side-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #d9dfe3;
      padding: 12px 10px;
      text-align: left;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .side-btn:hover,
    .side-btn.active {
      background: #26343d;
      color: white;
    }

    /* MAIN */

    .main {
      padding: 14px;
      min-width: 0;
    }

    .market-bar {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .market-label {
      color: #7a8288;
      font-size: 10px;
      font-weight: 900;
      display: block;
      margin-bottom: 4px;
    }

    .market-select {
      min-width: 200px;
      padding: 9px;
      border: 1px solid #d3d7da;
      border-radius: 6px;
      background: white;
      font-weight: 700;
    }

    .market-live {
      margin-left: auto;
      color: #11915c;
      font-size: 11px;
      font-weight: 900;
    }

    /* TRADING AREA */

    .trading-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 12px;
    }

    .chart-card {
      background: var(--dark);
      border-radius: 8px;
      overflow: hidden;
    }

    .chart-top {
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      border-bottom: 1px solid #26343d;
    }

    .chart-name {
      font-size: 13px;
      font-weight: 900;
    }

    .price {
      font-size: 25px;
      font-weight: 900;
      margin-top: 5px;
    }

    .price-last {
      color: var(--red);
    }

    .last-box {
      text-align: right;
    }

    .last-label {
      color: #8c989f;
      font-size: 9px;
      font-weight: 900;
    }

    .last-digit {
      color: var(--red);
      font-size: 26px;
      font-weight: 900;
    }

    .chart {
      height: 390px;
      position: relative;
      background:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    #chartCanvas {
      width: 100%;
      height: 100%;
    }

    .ticks {
      display: flex;
      gap: 5px;
      overflow: hidden;
      padding: 9px;
      background: #0c1318;
    }

    .tick {
      min-width: 32px;
      height: 29px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1d2a32;
      color: white;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 900;
    }

    .tick.latest {
      background: var(--red);
    }

    /* TRADE PANEL */

    .trade-panel,
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .panel-title {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      font-weight: 900;
    }

    .panel-body {
      padding: 14px;
    }

    .contract-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 14px;
    }

    .contract-tab {
      border: 1px solid #d5d9dc;
      background: white;
      padding: 9px 4px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 900;
    }

    .contract-tab.active {
      color: var(--red);
      border-color: var(--red);
      background: #fff6f5;
    }

    .control {
      margin-bottom: 13px;
    }

    .control label {
      display: block;
      color: #70777d;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .control input,
    .control select {
      width: 100%;
      border: 1px solid #d3d7da;
      border-radius: 6px;
      padding: 10px;
      background: white;
      outline: none;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 14px;
    }

    .choice {
      border: 1px solid #d5d9dc;
      background: white;
      padding: 12px 5px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 12px;
    }

    .choice.green {
      color: #087c4a;
    }

    .choice.red {
      color: #c62828;
    }

    .choice.selected {
      color: white;
      background: #17232c;
      border-color: #17232c;
    }

    .quote {
      background: #f5f6f7;
      padding: 11px;
      border-radius: 6px;
      margin-bottom: 13px;
    }

    .quote-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .quote-row:last-child {
      margin-bottom: 0;
    }

    .buy-button {
      width: 100%;
      border: 0;
      background: var(--red);
      color: white;
      padding: 14px;
      border-radius: 7px;
      font-weight: 900;
    }

    .buy-button:hover {
      background: #e63229;
    }

    .trade-message {
      min-height: 18px;
      text-align: center;
      margin-top: 9px;
      color: #6b7280;
      font-size: 11px;
    }

    /* DEPOSIT / WITHDRAW */

    .money-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 10px;
    }

    .money-buttons button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #d3d7da;
      background: white;
      font-weight: 800;
      font-size: 11px;
    }

    .deposit {
      color: #087c4a;
    }

    .withdraw {
      color: #c62828;
    }

    /* ANALYSIS */

    .card {
      margin-top: 12px;
      padding: 14px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 13px;
    }

    .digits {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
    }

    .digit {
      border: 1px solid #e3e6e8;
      border-radius: 6px;
      padding: 7px 3px;
      text-align: center;
    }

    .digit-number {
      font-weight: 900;
      margin-bottom: 5px;
    }

    .bar {
      height: 5px;
      background: #e8ebed;
      border-radius: 5px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      background: var(--red);
    }

    .percent {
      color: #737b82;
      font-size: 9px;
      margin-top: 4px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat {
      background: #f6f7f8;
      padding: 12px;
      border-radius: 6px;
    }

    .stat-label {
      color: #7a8288;
      font-size: 10px;
      font-weight: 800;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 900;
      margin-top: 5px;
    }

    /* HISTORY */

    .history {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .history th,
    .history td {
      padding: 10px;
      border-bottom: 1px solid #edf0f2;
      text-align: left;
    }

    .history th {
      color: #788087;
      font-size: 9px;
      text-transform: uppercase;
    }

    .profit {
      color: #087c4a;
      font-weight: 900;
    }

    .loss {
      color: #c62828;
      font-weight: 900;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.55);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 12px;
      padding: 22px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .modal-subtitle {
      color: #747b82;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .modal-actions button {
      flex: 1;
      padding: 11px;
      border-radius: 6px;
      border: 0;
      font-weight: 800;
    }

    .cancel {
      background: #edf0f2;
    }

    .confirm {
      background: var(--red);
      color: white;
    }

    /* RESPONSIVE */

    @media(max-width: 1000px) {
      .trading-grid {
        grid-template-columns: 1fr;
      }
    }

    @media(max-width: 760px) {
      .layout {
        display: block;
      }

      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 9px;
        height: 58px;
      }

      .brand {
        font-size: 19px;
      }

      .balance {
        font-size: 10px;
        padding: 7px;
      }

      .logout {
        font-size: 10px;
        padding: 7px;
      }

      .account-switch button {
        padding: 7px 8px;
        font-size: 10px;
      }

      .main {
        padding: 8px;
      }

      .chart {
        height: 310px;
      }

      .digits {
        grid-template-columns: repeat(5, 1fr);
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .market-live {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="authScreen">

  <div class="auth-card">

    <div class="logo">
      Trade<span>Hub</span>
    </div>

    <div class="auth-subtitle">
      Digital Trading Terminal
    </div>

    <div class="tabs">
      <button id="loginTab" class="active">
        Login
      </button>

      <button id="signupTab">
        Create Account
      </button>
    </div>

    <div id="authMessage" class="message"></div>

    <div class="field">
      <label>Email</label>

      <input
        id="emailInput"
        type="email"
        placeholder="Email address">
    </div>

    <div class="field">
      <label>Password</label>

      <input
        id="passwordInput"
        type="password"
        placeholder="Password">
    </div>

    <button id="authButton" class="auth-button">
      Login
    </button>

  </div>

</section>


<!-- =========================
     APPLICATION
========================= -->

<section id="app">

  <header class="topbar">

    <div class="brand">
      Trade<span>Hub</span>
    </div>

    <div class="top-right">

      <div class="account-switch">

        <button
          id="demoAccount"
          class="active">
          DEMO
        </button>

        <button id="realAccount">
          REAL
        </button>

      </div>

      <div class="balance">
        $<span id="balance">10,000.00</span>
      </div>

      <button id="logoutButton" class="logout">
        Logout
      </button>

    </div>

  </header>


  <div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="side-title">
        Trading
      </div>

      <button class="side-btn active">
        Trading Terminal
      </button>

      <button class="side-btn">
        Open Positions
      </button>

      <button class="side-btn">
        Trade History
      </button>

      <div class="side-title">
        Account
      </div>

      <button
        id="profileButton"
        class="side-btn">
        Profile
      </button>

      <button
        id="depositButton"
        class="side-btn">
        Deposit
      </button>

      <button
        id="withdrawButton"
        class="side-btn">
        Withdraw
      </button>

    </aside>


    <!-- MAIN -->

    <main class="main">

      <!-- MARKET -->

      <div class="market-bar">

        <div>

          <span class="market-label">
            MARKET
          </span>

          <select
            id="marketSelect"
            class="market-select">

            <option>
              Volatility 10 Index
            </option>

            <option>
              Volatility 25 Index
            </option>

            <option>
              Volatility 50 Index
            </option>

            <option>
              Volatility 75 Index
            </option>

            <option>
              Volatility 100 Index
            </option>

          </select>

        </div>

        <div class="market-live">
          ● MARKET OPEN
        </div>

      </div>


      <!-- TRADING -->

      <div class="trading-grid">

        <!-- CHART -->

        <section class="chart-card">

          <div class="chart-top">

            <div>

              <div
                id="chartMarket"
                class="chart-name">
                Volatility 10 Index
              </div>

              <div
                id="price"
                class="price">
                1000.000
              </div>

            </div>

            <div class="last-box">

              <div class="last-label">
                LAST DIGIT
              </div>

              <div
                id="lastDigit"
                class="last-digit">
                0
              </div>

            </div>

          </div>

          <div class="chart">
            <canvas id="chartCanvas"></canvas>
          </div>

          <div
            id="ticks"
            class="ticks">
          </div>

        </section>


        <!-- TRADE PANEL -->

        <section class="trade-panel">

          <div class="panel-title">
            Trade
          </div>

          <div class="panel-body">

            <!-- CONTRACT TYPES -->

            <div class="contract-tabs">

              <button
                class="contract-tab active"
                data-contract="overunder">
                Over/Under
              </button>

              <button
                class="contract-tab"
                data-contract="evenodd">
                Even/Odd
              </button>

              <button
                class="contract-tab"
                data-contract="matchdiff">
                Matches/Differs
              </button>

            </div>


            <!-- PREDICTION -->

            <div
              id="predictionControl"
              class="control">

              <label>
                Prediction
              </label>

              <select id="prediction">

                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>

              </select>

            </div>


            <!-- OVER UNDER -->

            <div
              id="overUnderChoices"
              class="choice-grid">

              <button
                id="overButton"
                class="choice green">
                OVER
              </button>

              <button
                id="underButton"
                class="choice red">
                UNDER
              </button>

            </div>


            <!-- EVEN ODD -->

            <div
              id="evenOddChoices"
              class="choice-grid"
              style="display:none">

              <button
                id="evenButton"
                class="choice green">
                EVEN
              </button>

              <button
                id="oddButton"
                class="choice red">
                ODD
              </button>

            </div>


            <!-- MATCH DIFFER -->

            <div
              id="matchDiffChoices"
              class="choice-grid"
              style="display:none">

              <button
